<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2c5aa0" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1a3a6e" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="../manifest.json">
    <link rel="apple-touch-icon" href="../icons/icon.png">
    <link rel="icon" href="../icons/icon.png" type="image/png">
    <title id="page-title">Snow Report</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body class="has-bottom-nav">
    <!-- Pull-to-refresh indicator -->
    <div class="pull-indicator" id="pullIndicator">
        <div class="pull-spinner"></div>
    </div>

    <div class="header">
        <div class="header-content">
            <h1 id="page-heading">Snow Report</h1>
            <div class="date-nav" id="dateNav">
                <div class="date-controls">
                    <button class="nav-btn" id="prevBtn" onclick="navigateDate(-1)" aria-label="Previous day">
                        <span class="nav-text-short">‹</span>
                        <span class="nav-text-full">← Previous</span>
                    </button>
                    <span class="date-display" id="dateDisplay" onclick="openDatePicker()" tabindex="0" role="button" aria-label="Select date">Loading...</span>
                    <button class="nav-btn" id="nextBtn" onclick="navigateDate(1)" aria-label="Next day">
                        <span class="nav-text-short">›</span>
                        <span class="nav-text-full">Next →</span>
                    </button>
                </div>
                <input type="date" id="datePicker" onchange="selectDate()" aria-label="Date picker">
            </div>
        </div>
    </div>

    <div class="container">
        <div id="content">
            <div class="skeleton-container">
                <div class="skeleton skeleton-card"></div>
                <div class="skeleton skeleton-card"></div>
                <div class="skeleton skeleton-card"></div>
            </div>
        </div>
    </div>

    <div class="footer">
        <p id="update-time">Data updated daily</p>
    </div>

    <script>
        // Auto-detect resort key from URL path
        const pathParts = window.location.pathname.split('/');
        const dataIndex = pathParts.findIndex(part => part === 'data');
        const RESORT_KEY = pathParts[dataIndex + 1];
        let currentDate = null;
        let useMetric = localStorage.getItem('snow-metric') === 'true';
        let snowData = null;

        // Fetch resort config to get display name
        fetch('../index.json')
            .then(r => r.json())
            .then(index => {
                const resortInfo = index.resorts[RESORT_KEY];
                if (resortInfo) {
                    const resortName = resortInfo.name;
                    document.getElementById('page-title').textContent = `${resortName} Snow Report`;
                    document.getElementById('page-heading').textContent = `${resortName} Snow`;
                }
            })
            .catch(err => console.warn('Could not load resort name:', err));

        function formatDate(dateStr) {
            const date = new Date(dateStr + 'T12:00:00');
            return date.toLocaleDateString('en-US', {
                weekday: 'long',
                month: 'long',
                day: 'numeric'
            });
        }

        function formatShortDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString('en-US', {
                weekday: 'short',
                month: 'short',
                day: 'numeric'
            });
        }

        function toggleMetric() {
            useMetric = !useMetric;
            localStorage.setItem('snow-metric', useMetric);
            if (snowData) {
                renderSnowData(snowData);
            }
            if (typeof hapticFeedback === 'function') {
                hapticFeedback('light');
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function getWeatherEmoji(description) {
            const desc = (description || '').toLowerCase();
            if (desc.includes('snow') && desc.includes('wind')) return '🌨️💨';
            if (desc.includes('snow')) return '🌨️';
            if (desc.includes('rain') && desc.includes('snow')) return '🌧️❄️';
            if (desc.includes('rain')) return '🌧️';
            if (desc.includes('wind')) return '💨';
            if (desc.includes('cloudy') || desc.includes('overcast')) return '☁️';
            if (desc.includes('partly')) return '⛅';
            if (desc.includes('sun') || desc.includes('clear')) return '☀️';
            return '🌤️';
        }

        function renderSnowData(data) {
            snowData = data;
            const content = document.getElementById('content');

            const snowfall = data.snowfall || {};
            const baseDepth = data.baseDepth || {};
            const conditions = data.conditions || 'Unknown';
            const forecast = data.forecast?.locations?.[0];

            // Get temperature
            const today = forecast?.today || {};
            const tempUnit = useMetric ? '°C' : '°F';
            const snowUnit = useMetric ? 'cm' : '"';
            const highTemp = useMetric ? today.high_c : today.high_f;
            const lowTemp = useMetric ? today.low_c : today.low_f;

            let html = '<div class="stagger-fade-in">';

            // Current Conditions Widget
            html += `
                <div class="widget-card">
                    <div class="widget-header">
                        <div class="widget-title-group">
                            <span class="widget-title">Current Conditions</span>
                            <span class="widget-subtitle">${data.lastUpdated || 'Updated today'}</span>
                        </div>
                        <button onclick="toggleMetric()" class="unit-toggle" aria-label="Toggle units">
                            ${useMetric ? 'Metric' : 'Imperial'}
                        </button>
                    </div>
                    <div class="weather-condition-banner">
                        ${getWeatherEmoji(conditions)} ${escapeHtml(conditions)}
                    </div>
                    <div class="weather-stats-grid">
                        <div class="weather-stat">
                            <span class="weather-stat-value">${highTemp ?? '--'}${tempUnit}</span>
                            <span class="weather-stat-label">High</span>
                        </div>
                        <div class="weather-stat">
                            <span class="weather-stat-value">${lowTemp ?? '--'}${tempUnit}</span>
                            <span class="weather-stat-label">Low</span>
                        </div>
                        <div class="weather-stat">
                            <span class="weather-stat-value">${today.wind || '--'}</span>
                            <span class="weather-stat-label">Wind</span>
                        </div>
                    </div>
                </div>
            `;

            // Snowfall Widget
            const overnight = useMetric ? snowfall.overnight_cm : snowfall.overnight_inches;
            const h24 = useMetric ? snowfall['24hour_cm'] : snowfall['24hour_inches'];
            const h48 = useMetric ? snowfall['48hour_cm'] : snowfall['48hour_inches'];
            const d7 = useMetric ? snowfall['7day_cm'] : snowfall['7day_inches'];
            const season = useMetric ? snowfall.season_total_cm : snowfall.season_total_inches;
            const base = useMetric ? baseDepth.cm : baseDepth.inches;

            html += `
                <div class="widget-card">
                    <div class="widget-header">
                        <div class="widget-title-group">
                            <span class="widget-title">Snowfall</span>
                            <span class="widget-subtitle">Recent accumulation</span>
                        </div>
                    </div>
                    <div class="snow-stats-grid">
                        <div class="snow-stat snow-stat-highlight">
                            <span class="snow-stat-value">${overnight ?? 0}${snowUnit}</span>
                            <span class="snow-stat-label">Overnight</span>
                        </div>
                        <div class="snow-stat">
                            <span class="snow-stat-value">${h24 ?? 0}${snowUnit}</span>
                            <span class="snow-stat-label">24 Hour</span>
                        </div>
                        <div class="snow-stat">
                            <span class="snow-stat-value">${h48 ?? 0}${snowUnit}</span>
                            <span class="snow-stat-label">48 Hour</span>
                        </div>
                        <div class="snow-stat">
                            <span class="snow-stat-value">${d7 ?? 0}${snowUnit}</span>
                            <span class="snow-stat-label">7 Day</span>
                        </div>
                    </div>
                    <div class="weather-terrain-row">
                        <div class="terrain-stat">
                            <span class="terrain-stat-value">${base ?? '--'}${snowUnit}</span>
                            <span class="terrain-stat-label">Base Depth</span>
                        </div>
                        <div class="terrain-stat">
                            <span class="terrain-stat-value">${season ?? '--'}${snowUnit}</span>
                            <span class="terrain-stat-label">Season Total</span>
                        </div>
                    </div>
                </div>
            `;

            // 5-Day Forecast Widget
            if (forecast?.forecast_days?.length > 0) {
                html += `
                    <div class="widget-card">
                        <div class="widget-header">
                            <div class="widget-title-group">
                                <span class="widget-title">5-Day Forecast</span>
                                <span class="widget-subtitle">What's coming next</span>
                            </div>
                        </div>
                        <div class="forecast-list">
                `;

                forecast.forecast_days.slice(0, 5).forEach((day, idx) => {
                    const dayHigh = useMetric ? day.high_c : day.high_f;
                    const dayLow = useMetric ? day.low_c : day.low_f;
                    const daySnow = (day.snowfall_day_inches || 0) + (day.snowfall_night_inches || 0);
                    const daySnowDisplay = useMetric ? Math.round(daySnow * 2.54) : daySnow;
                    const emoji = getWeatherEmoji(day.description);

                    html += `
                        <div class="forecast-day ${idx === 0 ? 'forecast-day-today' : ''}">
                            <div class="forecast-day-name">${idx === 0 ? 'Today' : formatShortDate(day.date)}</div>
                            <div class="forecast-day-icon">${emoji}</div>
                            <div class="forecast-day-desc">${escapeHtml(day.description || '')}</div>
                            <div class="forecast-day-temps">
                                <span class="forecast-high">${dayHigh}°</span>
                                <span class="forecast-low">${dayLow}°</span>
                            </div>
                            ${daySnow > 0 ? `<div class="forecast-day-snow">❄️ ${daySnowDisplay}${snowUnit}</div>` : '<div class="forecast-day-snow"></div>'}
                        </div>
                    `;
                });

                html += '</div></div>';
            }

            html += '</div>';
            content.innerHTML = html;
        }

        async function loadData(dateStr) {
            try {
                const url = `../${RESORT_KEY}/snow/${dateStr}.json`;
                const response = await fetch(url);
                if (!response.ok) throw new Error('Data not found');

                const data = await response.json();
                renderSnowData(data);

                document.getElementById('dateDisplay').textContent = formatDate(dateStr);
                currentDate = dateStr;

                document.getElementById('prevBtn').disabled = false;
                document.getElementById('nextBtn').disabled = dateStr >= new Date().toISOString().split('T')[0];

                // Update footer
                if (data.lastUpdated) {
                    document.getElementById('update-time').textContent = data.lastUpdated;
                }
            } catch (error) {
                document.getElementById('content').innerHTML =
                    `<div class="error">No snow data available for ${formatDate(dateStr)}</div>`;
            }
        }

        function navigateDate(offset) {
            const date = new Date(currentDate + 'T12:00:00');
            date.setDate(date.getDate() + offset);
            const newDate = date.toISOString().split('T')[0];
            loadData(newDate);
            if (typeof hapticFeedback === 'function') {
                hapticFeedback('light');
            }
        }

        function openDatePicker() {
            const picker = document.getElementById('datePicker');
            picker.value = currentDate;
            if (picker.showPicker) picker.showPicker();
        }

        function selectDate() {
            const selected = document.getElementById('datePicker').value;
            if (selected) loadData(selected);
        }

        // Load latest data on page load
        fetch(`../${RESORT_KEY}/snow/latest.json`)
            .then(r => r.json())
            .then(data => {
                currentDate = data.date;
                loadData(currentDate);
            })
            .catch(() => {
                const today = new Date().toISOString().split('T')[0];
                loadData(today);
            });
    </script>
    <script src="../pwa.js"></script>
    <script src="../debug.js"></script>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav" id="bottomNav">
        <a href="grooming.html" class="nav-tab">
            <span class="nav-tab-icon">🏔️</span>
            <span class="nav-tab-label">Overview</span>
        </a>
        <a href="trails.html" class="nav-tab">
            <span class="nav-tab-icon">🥽</span>
            <span class="nav-tab-label">Trails</span>
        </a>
        <a href="snow.html" class="nav-tab active">
            <span class="nav-tab-icon">❄️</span>
            <span class="nav-tab-label">Snow</span>
        </a>
        <a href="lifts.html" class="nav-tab" id="liftsTab">
            <span class="nav-tab-icon">🚡</span>
            <span class="nav-tab-label">Lifts</span>
        </a>
    </nav>
</body>
</html>
