<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2c5aa0" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1a3a6e" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="../manifest.json">
    <link rel="apple-touch-icon" href="../icons/icon.png">
    <link rel="icon" href="../icons/icon.png" type="image/png">
    <title id="page-title">Lift Status</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body class="has-bottom-nav">
    <!-- Pull-to-refresh indicator -->
    <div class="pull-indicator" id="pullIndicator">
        <div class="pull-spinner"></div>
    </div>

    <div class="header">
        <div class="header-content">
            <div class="trails-header">
                <h1 id="page-heading">Lift Status</h1>
                <p class="trails-subtitle" id="liftCount">Loading lifts...</p>
            </div>
        </div>
    </div>

    <div class="container">
        <div id="content">
            <div class="skeleton-container">
                <div class="skeleton skeleton-card"></div>
                <div class="skeleton skeleton-card"></div>
            </div>
        </div>
    </div>

    <div class="footer">
        <p id="update-time">Data updated every 4 minutes</p>
    </div>

    <script>
        // Auto-detect resort key from URL path
        const pathParts = window.location.pathname.split('/');
        const dataIndex = pathParts.findIndex(part => part === 'data');
        const RESORT_KEY = pathParts[dataIndex + 1];

        let allLifts = [];
        let currentSort = 'wait'; // 'wait', 'name', 'status'
        let searchTerm = '';

        // Fetch resort config to get display name
        fetch('../index.json')
            .then(r => r.json())
            .then(index => {
                const resortInfo = index.resorts[RESORT_KEY];
                if (resortInfo) {
                    const resortName = resortInfo.name;
                    document.getElementById('page-title').textContent = `${resortName} Lift Status`;
                    document.getElementById('page-heading').textContent = `${resortName} Lifts`;
                }
            })
            .catch(err => console.warn('Could not load resort name:', err));

        // Load lift data
        fetch(`lifts/index.json`)
            .then(r => r.json())
            .then(data => {
                allLifts = data.lifts || [];
                document.getElementById('liftCount').textContent = `${allLifts.length} lifts tracked`;
                renderPage();
                updateFooter(data.generated);
            })
            .catch(err => {
                console.error('Error loading lifts:', err);
                document.getElementById('liftCount').textContent = 'No lift data available';
                document.getElementById('content').innerHTML =
                    '<div class="error">Lift data is not available for this resort.</div>';
            });

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function renderPage() {
            const content = document.getElementById('content');
            const openLifts = allLifts.filter(l => l.status === 'Open');
            const closedLifts = allLifts.filter(l => l.status === 'Closed');

            let html = '<div class="stagger-fade-in">';

            // Stats Widget
            html += `
                <div class="widget-card">
                    <div class="widget-header">
                        <div class="widget-title-group">
                            <span class="widget-title">Lift Summary</span>
                            <span class="widget-subtitle">Current operating status</span>
                        </div>
                    </div>
                    <div class="weather-stats-grid">
                        <div class="weather-stat">
                            <span class="weather-stat-value lift-stat-open">${openLifts.length}</span>
                            <span class="weather-stat-label">Open</span>
                        </div>
                        <div class="weather-stat">
                            <span class="weather-stat-value lift-stat-closed">${closedLifts.length}</span>
                            <span class="weather-stat-label">Closed</span>
                        </div>
                        <div class="weather-stat">
                            <span class="weather-stat-value">${allLifts.length}</span>
                            <span class="weather-stat-label">Total</span>
                        </div>
                    </div>
                </div>
            `;

            // Sort & Filter Controls
            html += `
                <div class="lifts-controls">
                    <div class="sort-controls">
                        <button class="sort-btn ${currentSort === 'wait' ? 'active' : ''}" onclick="setSort('wait')">Wait Time</button>
                        <button class="sort-btn ${currentSort === 'name' ? 'active' : ''}" onclick="setSort('name')">A-Z</button>
                        <button class="sort-btn ${currentSort === 'status' ? 'active' : ''}" onclick="setSort('status')">Status</button>
                    </div>
                    <div class="search-wrapper">
                        <button class="search-btn" id="searchBtn" onclick="toggleSearch()">🔍</button>
                        <div class="search-dropdown" id="searchDropdown">
                            <input type="text" class="search-input" id="searchInput" placeholder="Search lifts..." oninput="filterLifts()">
                            <button class="search-clear" id="searchClear" onclick="clearSearch()">×</button>
                        </div>
                    </div>
                </div>
            `;

            // Get filtered and sorted lifts
            let displayLifts = searchTerm
                ? allLifts.filter(l => l.name.toLowerCase().includes(searchTerm))
                : allLifts;

            // Sort lifts
            displayLifts = sortLifts(displayLifts);

            if (displayLifts.length === 0 && searchTerm) {
                html += `
                    <div class="no-results">
                        <div class="no-results-icon">🔍</div>
                        <div class="no-results-text">No lifts match your search</div>
                    </div>
                `;
            } else {
                // All Lifts List
                html += `
                    <div class="widget-card">
                        <div class="widget-header">
                            <div class="widget-title-group">
                                <span class="widget-title">All Lifts</span>
                                <span class="widget-subtitle">${displayLifts.length} lift${displayLifts.length !== 1 ? 's' : ''}</span>
                            </div>
                        </div>
                        <ul class="lift-list">
                `;

                displayLifts.forEach(lift => {
                    const isOpen = lift.status === 'Open';
                    const statusClass = lift.status.toLowerCase();
                    const waitMinutes = lift.waitMinutes;
                    const hasWaitData = waitMinutes !== null && waitMinutes !== undefined && isOpen;
                    const liftUrl = lift.slug ? `lift.html?name=${encodeURIComponent(lift.slug)}` : '#';

                    let detailsHtml = '';
                    if (hasWaitData) {
                        detailsHtml = `<span class="lift-details">${waitMinutes} min wait</span>`;
                    } else if (isOpen && lift.closeTime) {
                        detailsHtml = `<span class="lift-details">Closes at ${lift.closeTime}</span>`;
                    } else if (!isOpen) {
                        detailsHtml = `<span class="lift-details">${formatLiftType(lift.type)}</span>`;
                    }

                    html += `
                        <li class="lift-item">
                            <a href="${liftUrl}" class="lift-item-link">
                                <span class="lift-status-dot ${statusClass}"></span>
                                <div class="lift-info">
                                    <span class="lift-name">${escapeHtml(lift.name)}</span>
                                    ${detailsHtml}
                                </div>
                                ${hasWaitData
                                    ? `<span class="lift-wait-badge">${waitMinutes} min</span>`
                                    : `<span class="lift-badge ${statusClass}">${lift.status}</span>`
                                }
                            </a>
                        </li>
                    `;
                });

                html += '</ul></div>';
            }

            html += '</div>';
            content.innerHTML = html;
        }

        function sortLifts(lifts) {
            const sorted = [...lifts];

            switch (currentSort) {
                case 'wait':
                    // Open lifts first, sorted by wait time (longest first), then closed
                    sorted.sort((a, b) => {
                        if (a.status === 'Open' && b.status !== 'Open') return -1;
                        if (a.status !== 'Open' && b.status === 'Open') return 1;
                        if (a.status === 'Open' && b.status === 'Open') {
                            return (b.waitMinutes || 0) - (a.waitMinutes || 0);
                        }
                        return a.name.localeCompare(b.name);
                    });
                    break;
                case 'name':
                    sorted.sort((a, b) => a.name.localeCompare(b.name));
                    break;
                case 'status':
                    // Open first, then closed, alphabetically within each
                    sorted.sort((a, b) => {
                        if (a.status === 'Open' && b.status !== 'Open') return -1;
                        if (a.status !== 'Open' && b.status === 'Open') return 1;
                        return a.name.localeCompare(b.name);
                    });
                    break;
            }

            return sorted;
        }

        function setSort(sort) {
            currentSort = sort;
            renderPage();
            if (typeof hapticFeedback === 'function') {
                hapticFeedback('light');
            }
        }

        function formatLiftType(type) {
            const typeMap = {
                'gondola': 'Gondola',
                'quad': 'Quad Chair',
                'six': '6-Pack Chair',
                'double': 'Double Chair',
                'triple': 'Triple Chair'
            };
            return typeMap[type] || type || 'Lift';
        }

        function toggleSearch() {
            const dropdown = document.getElementById('searchDropdown');
            const btn = document.getElementById('searchBtn');
            const input = document.getElementById('searchInput');

            if (dropdown.classList.contains('show')) {
                dropdown.classList.remove('show');
                btn.classList.remove('active');
            } else {
                dropdown.classList.add('show');
                btn.classList.add('active');
                input.focus();
            }
        }

        function filterLifts() {
            searchTerm = document.getElementById('searchInput').value.toLowerCase();
            renderPage();
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            searchTerm = '';
            document.getElementById('searchDropdown').classList.remove('show');
            document.getElementById('searchBtn').classList.remove('active');
            renderPage();
        }

        function updateFooter(generated) {
            if (!generated) return;
            const genDate = new Date(generated);
            document.getElementById('update-time').textContent =
                `Last updated: ${genDate.toLocaleString()}`;
        }

        // Close search on click outside
        document.addEventListener('click', function(e) {
            const wrapper = document.querySelector('.search-wrapper');
            if (wrapper && !wrapper.contains(e.target)) {
                document.getElementById('searchDropdown')?.classList.remove('show');
                document.getElementById('searchBtn')?.classList.remove('active');
            }
        });
    </script>
    <script src="../pwa.js"></script>
    <script src="../debug.js"></script>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav" id="bottomNav">
        <a href="grooming.html" class="nav-tab">
            <span class="nav-tab-icon">🏔️</span>
            <span class="nav-tab-label">Overview</span>
        </a>
        <a href="trails.html" class="nav-tab">
            <span class="nav-tab-icon">🥽</span>
            <span class="nav-tab-label">Trails</span>
        </a>
        <a href="snow.html" class="nav-tab">
            <span class="nav-tab-icon">❄️</span>
            <span class="nav-tab-label">Snow</span>
        </a>
        <a href="lifts.html" class="nav-tab active" id="liftsTab">
            <span class="nav-tab-icon">🚡</span>
            <span class="nav-tab-label">Lifts</span>
        </a>
    </nav>
</body>
</html>
