<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Snow Report</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f2f2f7;
            margin: 0;
            padding: 0;
            padding-bottom: 100px;
        }
        .header {
            background: linear-gradient(135deg, #007aff 0%, #5856d6 100%);
            color: white;
            padding: 20px 16px 16px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .resort-picker {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.2);
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }
        .resort-picker svg {
            width: 12px;
            height: 12px;
        }
        .header-title {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .header-date {
            font-size: 14px;
            opacity: 0.9;
            cursor: pointer;
            padding: 8px 12px;
            background: rgba(255,255,255,0.2);
            border-radius: 20px;
        }
        .date-picker-hidden {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }
        .container {
            padding: 16px;
        }
        .section {
            background: white;
            border-radius: 16px;
            margin-bottom: 16px;
            overflow: hidden;
        }
        .section-header {
            padding: 16px 16px 12px;
            font-size: 13px;
            font-weight: 600;
            color: #8e8e93;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Today's Conditions */
        .conditions-card {
            padding: 0 16px 16px;
        }
        .conditions-main {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
        }
        .temp-now {
            font-size: 64px;
            font-weight: 200;
            color: #1c1c1e;
            line-height: 1;
        }
        .temp-unit {
            font-size: 32px;
            font-weight: 300;
            vertical-align: top;
        }
        .conditions-details {
            flex: 1;
        }
        .conditions-desc {
            font-size: 18px;
            font-weight: 600;
            color: #1c1c1e;
            margin-bottom: 4px;
        }
        .conditions-hilo {
            font-size: 15px;
            color: #8e8e93;
        }
        .conditions-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            padding-top: 16px;
            border-top: 1px solid #e5e5ea;
        }
        .stat-item {
            text-align: center;
        }
        .stat-value {
            font-size: 22px;
            font-weight: 600;
            color: #007aff;
        }
        .stat-label {
            font-size: 11px;
            color: #8e8e93;
            text-transform: uppercase;
            margin-top: 2px;
        }

        /* Recent Snowfall */
        .snowfall-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            padding: 0 8px 16px;
        }
        .snowfall-item {
            text-align: center;
            padding: 8px 4px;
        }
        .snowfall-value {
            font-size: 24px;
            font-weight: 600;
            color: #007aff;
        }
        .snowfall-value.highlight {
            color: #34c759;
        }
        .snowfall-unit {
            font-size: 14px;
            font-weight: 400;
        }
        .snowfall-label {
            font-size: 10px;
            color: #8e8e93;
            text-transform: uppercase;
            margin-top: 4px;
            line-height: 1.2;
        }

        /* Forecast */
        .forecast-list {
            padding: 0 16px 8px;
        }
        .forecast-day {
            display: flex;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #e5e5ea;
        }
        .forecast-day:last-child {
            border-bottom: none;
        }
        .forecast-day-name {
            width: 80px;
            font-size: 15px;
            font-weight: 600;
            color: #1c1c1e;
        }
        .forecast-icon {
            width: 32px;
            height: 32px;
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .forecast-icon svg {
            width: 28px;
            height: 28px;
        }
        .forecast-desc {
            flex: 1;
            font-size: 14px;
            color: #8e8e93;
        }
        .forecast-temps {
            text-align: right;
        }
        .forecast-high {
            font-size: 15px;
            font-weight: 600;
            color: #1c1c1e;
        }
        .forecast-low {
            font-size: 13px;
            color: #8e8e93;
        }
        .forecast-snow {
            width: 50px;
            text-align: right;
            font-size: 14px;
            color: #34c759;
            font-weight: 500;
        }

        /* Base Depth */
        .base-depth-card {
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .base-depth-label {
            font-size: 15px;
            color: #1c1c1e;
        }
        .base-depth-value {
            font-size: 24px;
            font-weight: 600;
            color: #007aff;
        }

        /* Unit Toggle */
        .unit-toggle {
            display: flex;
            justify-content: center;
            margin-bottom: 16px;
        }
        .toggle-btn {
            background: white;
            border: none;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 500;
            color: #8e8e93;
            cursor: pointer;
        }
        .toggle-btn:first-child {
            border-radius: 8px 0 0 8px;
        }
        .toggle-btn:last-child {
            border-radius: 0 8px 8px 0;
        }
        .toggle-btn.active {
            background: #007aff;
            color: white;
        }

        /* Last Updated */
        .last-updated {
            text-align: center;
            font-size: 12px;
            color: #8e8e93;
            padding: 8px;
        }

        /* Loading/Error states */
        .loading, .error {
            text-align: center;
            padding: 40px 20px;
            color: #8e8e93;
        }
        .error {
            color: #ff3b30;
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-top: 1px solid #e5e5ea;
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            padding-bottom: max(8px, env(safe-area-inset-bottom));
            z-index: 1000;
        }
        .nav-tab {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #8e8e93;
            font-size: 10px;
            padding: 4px 12px;
            min-width: 64px;
        }
        .nav-tab.active {
            color: #007aff;
        }
        .nav-tab-icon {
            width: 24px;
            height: 24px;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .nav-tab-icon svg {
            width: 24px;
            height: 24px;
        }
        .nav-tab-label {
            font-weight: 500;
        }

        /* Resort Picker Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.4);
            z-index: 2000;
            align-items: flex-end;
            justify-content: center;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-content {
            background: white;
            border-radius: 16px 16px 0 0;
            width: 100%;
            max-height: 70vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .modal-header {
            padding: 16px;
            border-bottom: 1px solid #e5e5ea;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            background: white;
        }
        .modal-title {
            font-size: 17px;
            font-weight: 600;
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 17px;
            color: #007aff;
            cursor: pointer;
        }
        .resort-list {
            padding: 8px 0;
        }
        .resort-group-header {
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 600;
            color: #8e8e93;
            background: #f2f2f7;
        }
        .resort-item {
            padding: 12px 16px;
            border-bottom: 1px solid #e5e5ea;
            cursor: pointer;
        }
        .resort-item:active {
            background: #f2f2f7;
        }
        .resort-item.current {
            color: #007aff;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <div class="resort-picker" onclick="openResortPicker()">
                <span id="resortName">Loading...</span>
                <svg viewBox="0 0 12 12" fill="currentColor"><path d="M6 9L1 4h10L6 9z"/></svg>
            </div>
            <div class="header-title">Groomd</div>
            <div class="header-date" onclick="openDatePicker()" id="dateDisplay">Loading...</div>
        </div>
        <input type="date" id="datePicker" class="date-picker-hidden" onchange="selectDate()">
    </div>

    <div class="container">
        <div class="unit-toggle">
            <button class="toggle-btn active" id="imperialBtn" onclick="setUnit('imperial')">°F / in</button>
            <button class="toggle-btn" id="metricBtn" onclick="setUnit('metric')">°C / cm</button>
        </div>

        <div id="content">
            <div class="loading">Loading snow report...</div>
        </div>
    </div>

    <!-- Resort Picker Modal -->
    <div class="modal-overlay" id="resortModal" onclick="closeResortPicker(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <span class="modal-title">Select Resort</span>
                <button class="modal-close" onclick="closeResortPicker()">Done</button>
            </div>
            <div class="resort-list" id="resortList">
                <!-- Populated by JS -->
            </div>
        </div>
    </div>

    <script>
        const pathParts = window.location.pathname.split('/');
        const dataIndex = pathParts.findIndex(part => part === 'data');
        const RESORT_KEY = pathParts[dataIndex + 1];
        let currentDate = null;
        let snowData = null;
        let useMetric = false;

        // Weather icons by description
        function getWeatherIcon(desc) {
            const d = (desc || '').toLowerCase();
            if (d.includes('snow') || d.includes('flurr')) {
                return '<svg viewBox="0 0 24 24" fill="#007aff"><path d="M12 2C9.24 2 7 4.24 7 7c0 .84.21 1.63.58 2.32C5.44 10.08 4 11.87 4 14c0 2.76 2.24 5 5 5h10c2.21 0 4-1.79 4-4 0-1.76-1.14-3.25-2.72-3.78C19.84 8.28 16.94 6 13.5 6c-.58 0-1.14.07-1.68.2C11.93 4.32 12 4.16 12 4c0-1.1-.9-2-2-2zm-2 13l-2 2 2 2m4-4l2 2-2 2m-2-6v8"/></svg>';
            }
            if (d.includes('rain') || d.includes('shower')) {
                return '<svg viewBox="0 0 24 24" fill="#007aff"><path d="M12 2C9.24 2 7 4.24 7 7c0 .84.21 1.63.58 2.32C5.44 10.08 4 11.87 4 14c0 2.76 2.24 5 5 5h10c2.21 0 4-1.79 4-4 0-1.76-1.14-3.25-2.72-3.78C19.84 8.28 16.94 6 13.5 6c-.58 0-1.14.07-1.68.2C11.93 4.32 12 4.16 12 4c0-1.1-.9-2-2-2zm-4 15l-1 3m4-3l-2 6m4-6l-1 3"/></svg>';
            }
            if (d.includes('cloud') || d.includes('overcast')) {
                return '<svg viewBox="0 0 24 24" fill="#8e8e93"><path d="M19 18H6c-2.76 0-5-2.24-5-5 0-2.13 1.34-4 3.28-4.72C4.1 8.17 4 8.08 4 8c0-2.76 2.24-5 5-5 2.05 0 3.81 1.24 4.58 3h.42c2.76 0 5 2.24 5 5 0 .34-.04.67-.1 1H19c1.66 0 3 1.34 3 3s-1.34 3-3 3z"/></svg>';
            }
            if (d.includes('wind')) {
                return '<svg viewBox="0 0 24 24" fill="#8e8e93"><path d="M4 10h8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2H4v2zm0 4h12c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2H4v-2zm0 6h6c.55 0 1-.45 1-1s-.45-1-1-1H4v2z"/></svg>';
            }
            if (d.includes('clear') || d.includes('sunny')) {
                return '<svg viewBox="0 0 24 24" fill="#ffcc00"><circle cx="12" cy="12" r="5"/><path d="M12 2v2m0 16v2M4 12H2m20 0h-2m-2.93-7.07l-1.41 1.41m-9.32 9.32l-1.41 1.41m0-12.14l1.41 1.41m9.32 9.32l1.41 1.41"/></svg>';
            }
            return '<svg viewBox="0 0 24 24" fill="#8e8e93"><circle cx="12" cy="12" r="5"/></svg>';
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr + 'T12:00:00');
            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        }

        function formatDayName(dateStr) {
            const date = new Date(dateStr);
            const today = new Date();
            today.setHours(0,0,0,0);
            const checkDate = new Date(date);
            checkDate.setHours(0,0,0,0);

            const diffDays = Math.round((checkDate - today) / (1000 * 60 * 60 * 24));
            if (diffDays === 0) return 'Today';
            if (diffDays === 1) return 'Tomorrow';
            return date.toLocaleDateString('en-US', { weekday: 'short' });
        }

        function setUnit(unit) {
            useMetric = unit === 'metric';
            document.getElementById('imperialBtn').classList.toggle('active', !useMetric);
            document.getElementById('metricBtn').classList.toggle('active', useMetric);
            if (snowData) renderSnowData(snowData);
        }

        function renderSnowData(data) {
            snowData = data;
            const content = document.getElementById('content');
            const snowfall = data.snowfall || {};
            const baseDepth = data.baseDepth || {};
            const conditions = data.conditions || 'Unknown';

            // Get first location's forecast for today and upcoming days
            const location = data.forecast?.locations?.[0];
            const today = location?.today || {};
            const forecastDays = location?.forecast_days || [];

            const temp = useMetric ? today.high_c : today.high_f;
            const tempLo = useMetric ? today.low_c : today.low_f;
            const tempUnit = useMetric ? '°C' : '°F';
            const snowUnit = useMetric ? 'cm' : '"';

            let html = `
                <!-- Today's Conditions -->
                <div class="section">
                    <div class="section-header">Today's Conditions</div>
                    <div class="conditions-card">
                        <div class="conditions-main">
                            <div class="temp-now">${temp ?? '--'}<span class="temp-unit">${tempUnit}</span></div>
                            <div class="conditions-details">
                                <div class="conditions-desc">${today.description || conditions}</div>
                                <div class="conditions-hilo">H: ${temp ?? '--'}${tempUnit}  L: ${tempLo ?? '--'}${tempUnit}</div>
                            </div>
                        </div>
                        <div class="conditions-stats">
                            <div class="stat-item">
                                <div class="stat-value">${useMetric ? snowfall['24hour_cm'] : snowfall['24hour_inches']}${snowUnit}</div>
                                <div class="stat-label">24hr Snow</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-value">${useMetric ? baseDepth.cm : baseDepth.inches}${snowUnit}</div>
                                <div class="stat-label">Base Depth</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-value">${today.wind || '--'}</div>
                                <div class="stat-label">Wind</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Recent Snowfall -->
                <div class="section">
                    <div class="section-header">Recent Snowfall</div>
                    <div class="snowfall-grid">
                        <div class="snowfall-item">
                            <div class="snowfall-value${snowfall.overnight_inches > 0 ? ' highlight' : ''}">${useMetric ? snowfall.overnight_cm : snowfall.overnight_inches}<span class="snowfall-unit">${snowUnit}</span></div>
                            <div class="snowfall-label">Overnight</div>
                        </div>
                        <div class="snowfall-item">
                            <div class="snowfall-value${snowfall['24hour_inches'] > 0 ? ' highlight' : ''}">${useMetric ? snowfall['24hour_cm'] : snowfall['24hour_inches']}<span class="snowfall-unit">${snowUnit}</span></div>
                            <div class="snowfall-label">24 Hours</div>
                        </div>
                        <div class="snowfall-item">
                            <div class="snowfall-value${snowfall['48hour_inches'] > 0 ? ' highlight' : ''}">${useMetric ? snowfall['48hour_cm'] : snowfall['48hour_inches']}<span class="snowfall-unit">${snowUnit}</span></div>
                            <div class="snowfall-label">48 Hours</div>
                        </div>
                        <div class="snowfall-item">
                            <div class="snowfall-value">${useMetric ? snowfall['7day_cm'] : snowfall['7day_inches']}<span class="snowfall-unit">${snowUnit}</span></div>
                            <div class="snowfall-label">7 Days</div>
                        </div>
                        <div class="snowfall-item">
                            <div class="snowfall-value">${useMetric ? snowfall.season_total_cm : snowfall.season_total_inches}<span class="snowfall-unit">${snowUnit}</span></div>
                            <div class="snowfall-label">Season</div>
                        </div>
                    </div>
                </div>

                <!-- 5-Day Forecast -->
                <div class="section">
                    <div class="section-header">5-Day Forecast</div>
                    <div class="forecast-list">
            `;

            forecastDays.slice(0, 5).forEach((day, idx) => {
                const high = useMetric ? day.high_c : day.high_f;
                const low = useMetric ? day.low_c : day.low_f;
                const snowAmt = (day.snowfall_day_inches || 0) + (day.snowfall_night_inches || 0);
                const snowDisplay = snowAmt > 0 ? `${useMetric ? Math.round(snowAmt * 2.54) : snowAmt}${snowUnit}` : '';

                html += `
                    <div class="forecast-day">
                        <div class="forecast-day-name">${formatDayName(day.date)}</div>
                        <div class="forecast-icon">${getWeatherIcon(day.description)}</div>
                        <div class="forecast-desc">${day.description || ''}</div>
                        <div class="forecast-snow">${snowDisplay}</div>
                        <div class="forecast-temps">
                            <div class="forecast-high">${high ?? '--'}${tempUnit}</div>
                            <div class="forecast-low">${low ?? '--'}${tempUnit}</div>
                        </div>
                    </div>
                `;
            });

            html += `
                    </div>
                </div>
            `;

            if (data.lastUpdated) {
                html += `<div class="last-updated">${data.lastUpdated}</div>`;
            }

            content.innerHTML = html;
        }

        async function loadData(dateStr) {
            try {
                const url = `../${RESORT_KEY}/snow/${dateStr}.json`;
                const response = await fetch(url);
                if (!response.ok) throw new Error('Data not found');

                const data = await response.json();
                renderSnowData(data);

                document.getElementById('dateDisplay').textContent = formatDate(dateStr);
                currentDate = dateStr;
            } catch (error) {
                document.getElementById('content').innerHTML =
                    `<div class="error">No data available for ${formatDate(dateStr)}</div>`;
            }
        }

        function openDatePicker() {
            const picker = document.getElementById('datePicker');
            picker.value = currentDate;
            picker.showPicker?.();
        }

        function selectDate() {
            const selected = document.getElementById('datePicker').value;
            if (selected) loadData(selected);
        }

        // Resort picker functions
        function openResortPicker() {
            document.getElementById('resortModal').classList.add('active');
        }

        function closeResortPicker(event) {
            if (!event || event.target === event.currentTarget) {
                document.getElementById('resortModal').classList.remove('active');
            }
        }

        function selectResort(resortKey) {
            const currentPath = window.location.pathname;
            const newPath = currentPath.replace(/\/data\/[^\/]+\//, `/data/${resortKey}/`);
            window.location.href = newPath;
        }

        // Load resort list
        fetch('../index.json')
            .then(r => r.json())
            .then(index => {
                const resortInfo = index.resorts[RESORT_KEY];
                if (resortInfo) {
                    document.getElementById('resortName').textContent = resortInfo.name;
                    document.getElementById('page-title').textContent = `${resortInfo.name} Snow Report`;
                }

                // Build resort list
                const groups = {};
                Object.entries(index.resorts).forEach(([key, resort]) => {
                    const region = resort.region || 'Other';
                    if (!groups[region]) groups[region] = [];
                    groups[region].push({ key, name: resort.name });
                });

                let listHtml = '';
                Object.entries(groups).sort().forEach(([region, resorts]) => {
                    listHtml += `<div class="resort-group-header">${region}</div>`;
                    resorts.sort((a, b) => a.name.localeCompare(b.name)).forEach(resort => {
                        const isCurrent = resort.key === RESORT_KEY;
                        listHtml += `<div class="resort-item${isCurrent ? ' current' : ''}" onclick="selectResort('${resort.key}')">${resort.name}</div>`;
                    });
                });
                document.getElementById('resortList').innerHTML = listHtml;
            })
            .catch(err => console.warn('Could not load resort info:', err));

        // Load latest data
        fetch(`../${RESORT_KEY}/snow/latest.json`)
            .then(r => r.json())
            .then(data => {
                currentDate = data.date;
                loadData(currentDate);
            })
            .catch(() => {
                const today = new Date().toISOString().split('T')[0];
                loadData(today);
            });
    </script>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="grooming.html" class="nav-tab">
            <span class="nav-tab-icon"><svg width="24" height="24" viewBox="0 0 2048 2048"><path fill="currentColor" d="m1472 640l574 1152H0L768 256l447 897zm0 287l-185 369l47 95l111-111h203zM898 803L768 543L638 803l130 130zm-691 861h1121L958 924l-190 191l-191-191zm1263 0h369l-127-256h-213l-104 104z"/></svg></span>
            <span class="nav-tab-label">Overview</span>
