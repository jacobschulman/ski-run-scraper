<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Lift Wait Monitor</title>
  <style>
    :root {
      --bg: #0c1a2b;
      --panel: #0f243a;
      --card: rgba(255, 255, 255, 0.03);
      --border: rgba(255, 255, 255, 0.08);
      --text: #e9f1ff;
      --muted: #9bb3d1;
      --accent: #7bd8ff;
      --accent-2: #9b7bff;
      --positive: #7bffc3;
      --negative: #ff8f87;
      --chip: rgba(255, 255, 255, 0.06);
      --shadow: 0 10px 50px rgba(0, 0, 0, 0.4);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at 20% 20%, rgba(123, 216, 255, 0.08), transparent 30%), radial-gradient(circle at 80% 0%, rgba(155, 123, 255, 0.12), transparent 32%), var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 32px 18px 60px;
    }
    .page {
      max-width: 1200px;
      margin: 0 auto;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }
    h1 {
      margin: 0;
      font-size: 1.9rem;
      letter-spacing: -0.02em;
    }
    .subtitle {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 999px;
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      color: var(--text);
      font-size: 0.95rem;
      white-space: nowrap;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 14px;
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 6px;
      letter-spacing: 0.01em;
    }
    select, input {
      width: 100%;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      font-size: 1rem;
      box-shadow: var(--shadow);
      outline: none;
      transition: border-color 0.15s, background 0.15s;
    }
    select:focus, input:focus {
      border-color: var(--accent);
      background: rgba(255, 255, 255, 0.05);
    }
    .meta-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
    }
    .meta-pill {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 0.9rem;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    thead {
      background: linear-gradient(135deg, rgba(123, 216, 255, 0.12), rgba(155, 123, 255, 0.12));
    }
    th, td {
      text-align: left;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    th {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      font-weight: 700;
    }
    tbody tr:hover {
      background: rgba(255, 255, 255, 0.03);
    }
    .lift-name {
      font-weight: 600;
      letter-spacing: -0.01em;
      margin-bottom: 4px;
    }
    .lift-sub {
      color: var(--muted);
      font-size: 0.9rem;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 8px;
      background: var(--card);
      border: 1px solid var(--border);
      font-size: 0.9rem;
    }
    .status.open { color: var(--positive); border-color: rgba(123, 255, 195, 0.3); }
    .status.closed { color: var(--negative); border-color: rgba(255, 143, 135, 0.3); }
    .current-wait {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--text);
    }
    .current-meta {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 4px;
    }
    .chips {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: flex-start;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      border-radius: 10px;
      background: var(--chip);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.9rem;
    }
    .chip time {
      color: var(--muted);
      font-size: 0.85rem;
    }
    .empty {
      padding: 18px;
      color: var(--muted);
      text-align: center;
    }
    .wait-graph {
      margin-top: 12px;
      width: 100%;
      height: 60px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 8px;
      padding: 4px;
      border: 1px solid var(--border);
    }
    .wait-graph svg {
      width: 100%;
      height: 100%;
    }
    .graph-line {
      fill: none;
      stroke: var(--accent);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .graph-dot {
      fill: var(--accent);
    }
    .graph-axis {
      stroke: var(--border);
      stroke-width: 1;
    }
    .graph-label {
      fill: var(--muted);
      font-size: 10px;
    }
    .notice {
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.9rem;
    }
    @media (max-width: 860px) {
      .header { flex-direction: column; align-items: flex-start; }
      table, thead, tbody, th, td, tr { display: block; }
      thead { display: none; }
      tbody tr { margin-bottom: 12px; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: rgba(255,255,255,0.02); }
      td { border-bottom: 1px solid var(--border); padding: 12px 14px; }
      td:last-child { border-bottom: none; }
      td::before {
        content: attr(data-label);
        display: block;
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .chips { align-items: stretch; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="header">
      <div>
        <h1>Live Lift Wait Monitor</h1>
        <p class="subtitle">Debug view for all resorts with live lift scraping. Pick a resort to see most recent waits plus the last few runs.</p>
      </div>
      <div class="pill" id="resort-count">Loading…</div>
    </div>

    <div class="controls">
      <div>
        <label for="data-folder-select">Data Folder</label>
        <select id="data-folder-select" aria-label="Choose data folder">
          <option value=".">data (default)</option>
          <option value="../data-local">data-local</option>
        </select>
      </div>
      <div>
        <label for="resort-select">Resort</label>
        <select id="resort-select" aria-label="Choose resort"></select>
      </div>
      <div>
        <label for="lift-filter">Filter lifts (name or mountain)</label>
        <input id="lift-filter" type="search" placeholder="e.g. Gondola, Peak 8, Summit" aria-label="Filter lifts">
      </div>
    </div>

    <div class="meta-bar" id="meta-bar"></div>

    <div id="table-wrapper">
      <table id="lift-table" aria-live="polite">
        <thead>
          <tr>
            <th>Lift</th>
            <th>Status</th>
            <th>Most Recent Wait</th>
            <th>Prior Runs</th>
          </tr>
        </thead>
        <tbody id="lift-rows">
          <tr><td colspan="4" class="empty">Loading live data…</td></tr>
        </tbody>
      </table>
      <div class="notice" id="notice"></div>
    </div>
  </div>

  <script>
    const historyDepth = 6;
    let resorts = [];
    let resortMap = {};
    const historyCache = new Map();
    const cachedIndex = {};
    let dataFolder = '.';

    const $ = (id) => document.getElementById(id);

    const timeAgo = (iso) => {
      if (!iso) return '';
      const t = new Date(iso);
      if (Number.isNaN(t)) return '';
      const diffMs = Date.now() - t.getTime();
      const minutes = Math.max(0, Math.round(diffMs / 60000));
      if (minutes < 1) return 'just now';
      if (minutes < 60) return minutes + 'm ago';
      const hours = Math.floor(minutes / 60);
      const rem = minutes % 60;
      if (hours < 24) return rem ? hours + 'h ' + rem + 'm ago' : hours + 'h ago';
      const days = Math.floor(hours / 24);
      return days + 'd ' + (hours % 24) + 'h ago';
    };

    const formatClock = (iso, tz) => {
      if (!iso) return '';
      const t = new Date(iso);
      if (Number.isNaN(t)) return '';
      return new Intl.DateTimeFormat([], { hour: 'numeric', minute: '2-digit', timeZone: tz || 'UTC' }).format(t);
    };

    const formatWait = (value) => {
      if (value === null || value === undefined) return '—';
      if (Number.isNaN(Number(value))) return String(value);
      return value + ' min';
    };

    const deriveDateKey = (resort) => {
      const fromGenerated = resort.generated ? resort.generated.split('T')[0] : null;
      const fromLift = resort.lifts && resort.lifts.length ? resort.lifts[0].lastUpdated?.split('T')[0] : null;
      return fromGenerated || fromLift || new Date().toISOString().slice(0, 10);
    };

    async function fetchHistory(resortKey, dateKey) {
      const cacheKey = dataFolder + '-' + resortKey + '-' + dateKey;
      if (historyCache.has(cacheKey)) return historyCache.get(cacheKey);

      const promise = (async () => {
        const parseNdjson = (text) => {
          const lines = text.trim().split('\n').filter(Boolean);
          const parsed = [];
          for (const line of lines) {
            try { parsed.push(JSON.parse(line)); } catch (_) {}
          }
          const history = {};
          for (let i = parsed.length - 1; i >= 0; i--) {
            const entry = parsed[i];
            if (!entry || !entry.liftId) continue;
            const bucket = history[entry.liftId] || (history[entry.liftId] = []);
            if (bucket.length >= historyDepth) continue;
            if (bucket.some(h => h.timestamp === entry.timestamp)) continue;
            bucket.push(entry);
          }
          return history;
        };

        const tryFetch = async (rangeBytes) => {
          const headers = rangeBytes ? { 'Range': `bytes=-${rangeBytes}` } : {};
          const res = await fetch(`${dataFolder}/${resortKey}/lifts/${dateKey}.ndjson`, { headers });
          if (!res.ok) throw new Error(`NDJSON ${res.status}`);
          return res.text();
        };

        try {
          let text;
          let usedTail = true;

          try {
            text = await tryFetch(120000);
          } catch (_) {
            usedTail = false;
            text = await tryFetch();
          }

          let history = parseNdjson(text);
          const hasDepth = Object.values(history).some(list => list.length >= historyDepth);
          if (usedTail && !hasDepth) {
            text = await tryFetch();
            history = parseNdjson(text);
          }
          return history;
        } catch (_) {
          return {};
        }
      })();

      historyCache.set(cacheKey, promise);
      return promise;
    }

    function renderResortOptions() {
      const select = $('resort-select');
      select.innerHTML = '';
      const placeholder = document.createElement('option');
      placeholder.value = '';
      placeholder.textContent = 'Select a resort';
      placeholder.disabled = true;
      placeholder.selected = true;
      select.appendChild(placeholder);
      resorts.forEach(({ key, name }) => {
        const opt = document.createElement('option');
        opt.value = key;
        opt.textContent = name;
        select.appendChild(opt);
      });
    }

    function setMeta(resortData, dateKey, tz) {
      const metaBar = $('meta-bar');
      metaBar.innerHTML = '';
      if (!resortData) return;

      const metaItems = [
        { label: 'Lifts', value: resortData.liftCount || (resortData.lifts ? resortData.lifts.length : '—') },
        { label: 'Last scrape', value: resortData.generated ? timeAgo(resortData.generated) + ' · ' + formatClock(resortData.generated, tz) : '—' },
        { label: 'Data file', value: dateKey + '.ndjson' }
      ];

      metaItems.forEach(item => {
        const pill = document.createElement('div');
        pill.className = 'meta-pill';
        pill.innerHTML = '<strong>' + item.label + '</strong> ' + item.value;
        metaBar.appendChild(pill);
      });
    }

    function createWaitGraph(history, openTime, closeTime, tz) {
      if (!history || history.length === 0) return null;

      const width = 100;
      const height = 100;
      const padding = { top: 10, right: 10, bottom: 20, left: 30 };
      const graphWidth = width - padding.left - padding.right;
      const graphHeight = height - padding.top - padding.bottom;

      // Parse open/close times to get time range
      const parseTime = (timeStr) => {
        if (!timeStr) return null;
        const [h, m] = timeStr.split(':').map(Number);
        return h * 60 + m; // minutes since midnight
      };

      const openMinutes = parseTime(openTime) || 0;
      const closeMinutes = parseTime(closeTime) || 1440;

      // Prepare data points
      const dataPoints = history
        .map(entry => {
          const t = new Date(entry.timestamp);
          if (Number.isNaN(t)) return null;
          const minutes = t.getHours() * 60 + t.getMinutes();
          return {
            time: minutes,
            wait: entry.waitMinutes,
            timestamp: entry.timestamp
          };
        })
        .filter(p => p && p.wait !== null && p.wait !== undefined)
        .sort((a, b) => a.time - b.time);

      if (dataPoints.length === 0) return null;

      // Calculate scales
      const minTime = Math.min(openMinutes, ...dataPoints.map(p => p.time));
      const maxTime = Math.max(closeMinutes, ...dataPoints.map(p => p.time));
      const maxWait = Math.max(...dataPoints.map(p => p.wait), 5);

      const xScale = (minutes) => padding.left + ((minutes - minTime) / (maxTime - minTime)) * graphWidth;
      const yScale = (wait) => padding.top + graphHeight - ((wait / maxWait) * graphHeight);

      // Create SVG
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
      svg.setAttribute('preserveAspectRatio', 'none');

      // Draw axes
      const xAxis = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      xAxis.setAttribute('class', 'graph-axis');
      xAxis.setAttribute('x1', padding.left);
      xAxis.setAttribute('y1', padding.top + graphHeight);
      xAxis.setAttribute('x2', padding.left + graphWidth);
      xAxis.setAttribute('y2', padding.top + graphHeight);
      svg.appendChild(xAxis);

      const yAxis = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      yAxis.setAttribute('class', 'graph-axis');
      yAxis.setAttribute('x1', padding.left);
      yAxis.setAttribute('y1', padding.top);
      yAxis.setAttribute('x2', padding.left);
      yAxis.setAttribute('y2', padding.top + graphHeight);
      svg.appendChild(yAxis);

      // Add time labels
      const startLabel = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      startLabel.setAttribute('class', 'graph-label');
      startLabel.setAttribute('x', padding.left);
      startLabel.setAttribute('y', height - 4);
      startLabel.setAttribute('text-anchor', 'start');
      startLabel.textContent = openTime || '00:00';
      svg.appendChild(startLabel);

      const endLabel = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      endLabel.setAttribute('class', 'graph-label');
      endLabel.setAttribute('x', width - padding.right);
      endLabel.setAttribute('y', height - 4);
      endLabel.setAttribute('text-anchor', 'end');
      endLabel.textContent = closeTime || '23:59';
      svg.appendChild(endLabel);

      // Add max wait label
      const maxLabel = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      maxLabel.setAttribute('class', 'graph-label');
      maxLabel.setAttribute('x', 2);
      maxLabel.setAttribute('y', padding.top + 8);
      maxLabel.setAttribute('text-anchor', 'start');
      maxLabel.textContent = maxWait + 'm';
      svg.appendChild(maxLabel);

      // Draw line
      if (dataPoints.length > 1) {
        const pathData = dataPoints.map((p, i) => {
          const x = xScale(p.time);
          const y = yScale(p.wait);
          return (i === 0 ? 'M' : 'L') + x + ',' + y;
        }).join(' ');

        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('class', 'graph-line');
        path.setAttribute('d', pathData);
        svg.appendChild(path);
      }

      // Draw dots
      dataPoints.forEach(p => {
        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('class', 'graph-dot');
        circle.setAttribute('cx', xScale(p.time));
        circle.setAttribute('cy', yScale(p.wait));
        circle.setAttribute('r', 1.5);
        const title = document.createElementNS('http://www.w3.org/2000/svg', 'title');
        title.textContent = formatClock(p.timestamp, tz) + ': ' + p.wait + ' min';
        circle.appendChild(title);
        svg.appendChild(circle);
      });

      return svg;
    }

    function renderRows(resortData, history, tz) {
      const tbody = $('lift-rows');
      const filter = $('lift-filter').value.trim().toLowerCase();
      if (!resortData || !resortData.lifts) {
        tbody.innerHTML = '<tr><td colspan="4" class="empty">No lift data found.</td></tr>';
        return;
      }

      const lifts = [...resortData.lifts].sort((a, b) => a.name.localeCompare(b.name));
      let shown = 0;
      tbody.innerHTML = '';

      for (const lift of lifts) {
        const text = (lift.name + ' ' + (lift.mountain || '')).toLowerCase();
        if (filter && !text.includes(filter)) continue;

        const tr = document.createElement('tr');

        const liftCell = document.createElement('td');
        liftCell.setAttribute('data-label', 'Lift');
        const liftMetadata = [lift.mountain || 'Unknown zone', lift.type || ''];
        if (lift.openTime && lift.closeTime) {
          liftMetadata.push(lift.openTime + ' - ' + lift.closeTime);
        }
        liftCell.innerHTML = '<div class="lift-name">' + lift.name + '</div>' +
          '<div class="lift-sub">' + liftMetadata.filter(Boolean).join(' · ') + '</div>';
        tr.appendChild(liftCell);

        const statusCell = document.createElement('td');
        statusCell.setAttribute('data-label', 'Status');
        const status = document.createElement('span');
        status.className = 'status ' + (lift.status && lift.status.toLowerCase() === 'open' ? 'open' : 'closed');
        status.textContent = lift.status || '—';
        statusCell.appendChild(status);
        tr.appendChild(statusCell);

        const currentCell = document.createElement('td');
        currentCell.setAttribute('data-label', 'Most Recent Wait');
        const currentWait = document.createElement('div');
        currentWait.className = 'current-wait';
        currentWait.textContent = formatWait(lift.waitMinutes);
        const meta = document.createElement('div');
        meta.className = 'current-meta';
        meta.textContent = lift.lastUpdated ? 'as of ' + formatClock(lift.lastUpdated, tz) + ' (' + timeAgo(lift.lastUpdated) + ')' : 'no timestamp';
        currentCell.appendChild(currentWait);
        currentCell.appendChild(meta);
        tr.appendChild(currentCell);

        const histCell = document.createElement('td');
        histCell.setAttribute('data-label', 'Prior Runs');
        const chipsWrap = document.createElement('div');
        chipsWrap.className = 'chips';
        const hist = history[lift.liftId] || [];
        if (hist.length === 0) {
          histCell.innerHTML = '<div class="lift-sub">No prior runs</div>';
        } else {
          hist.forEach((entry, idx) => {
            const chip = document.createElement('span');
            chip.className = 'chip';
            chip.innerHTML = '<strong>' + formatWait(entry.waitMinutes) + '</strong> <time>' + timeAgo(entry.timestamp) + '</time>';
            if (idx === 0 && lift.lastUpdated && lift.lastUpdated !== entry.timestamp) {
              chip.title = 'Latest NDJSON time differs from lastUpdated';
            }
            chipsWrap.appendChild(chip);
          });
          histCell.appendChild(chipsWrap);

          // Add wait time graph
          const graph = createWaitGraph(hist, lift.openTime, lift.closeTime, tz);
          if (graph) {
            const graphContainer = document.createElement('div');
            graphContainer.className = 'wait-graph';
            graphContainer.appendChild(graph);
            histCell.appendChild(graphContainer);
          }
        }
        tr.appendChild(histCell);

        tbody.appendChild(tr);
        shown++;
      }

      if (!shown) {
        tbody.innerHTML = '<tr><td colspan="4" class="empty">No lifts match that filter.</td></tr>';
      }

      $('notice').textContent = 'Showing ' + shown + ' of ' + lifts.length + ' lifts' + (filter ? ' (filtered)' : '') + '.';
    }

    async function loadResort(resortKey) {
      const resortInfo = resortMap[resortKey];
      if (!resortInfo) return;
      $('notice').textContent = 'Loading recent runs…';

      try {
        const cacheKey = `${dataFolder}-${resortKey}`;
        if (!cachedIndex[cacheKey]) {
          const res = await fetch(`${dataFolder}/${resortKey}/lifts/index.json`);
          if (!res.ok) throw new Error('Index fetch failed');
          cachedIndex[cacheKey] = await res.json();
        }
        const resortData = cachedIndex[cacheKey];
        const dateKey = deriveDateKey(resortData);
        const tz = resortInfo.timezone || 'UTC';
        setMeta(resortData, dateKey, tz);
        const history = await fetchHistory(resortKey, dateKey);
        renderRows(resortData, history, tz);
      } catch (err) {
        $('lift-rows').innerHTML = '<tr><td colspan="4" class="empty">Failed to load resort data.</td></tr>';
        $('notice').textContent = err.message || String(err);
      }
    }

    function applyQueryParam(resortKey) {
      const url = new URL(window.location.href);
      url.searchParams.set('resort', resortKey);
      window.history.replaceState({}, '', url);
    }

    async function init() {
      // Restore data folder preference from localStorage
      const savedFolder = localStorage.getItem('dataFolder');
      if (savedFolder) {
        dataFolder = savedFolder;
        $('data-folder-select').value = savedFolder;
      }

      try {
        const configRes = await fetch('../config.json');
        const config = await configRes.json();
        resorts = (config.resorts || []).map(r => ({ key: r.key, name: r.name, timezone: r.timezone })).sort((a, b) => a.name.localeCompare(b.name));
        resortMap = resorts.reduce((acc, r) => { acc[r.key] = r; return acc; }, {});

        $('resort-count').textContent = resorts.length + ' resorts configured';
        renderResortOptions();

        const params = new URLSearchParams(window.location.search);
        const requested = params.get('resort');
        const initial = requested && resortMap[requested] ? requested : '';
        if (initial) {
          $('resort-select').value = initial;
          await loadResort(initial);
        } else {
          $('lift-rows').innerHTML = '<tr><td colspan="4" class="empty">Pick a resort to load live lift waits.</td></tr>';
          $('notice').textContent = 'Select a resort to load data.';
        }
      } catch (err) {
        $('lift-rows').innerHTML = '<tr><td colspan="4" class="empty">Failed to load config.json</td></tr>';
        $('notice').textContent = 'Could not load resort list.';
      }
    }

    $('resort-select').addEventListener('change', async (e) => {
      const key = e.target.value;
      applyQueryParam(key);
      await loadResort(key);
    });

    $('lift-filter').addEventListener('input', () => {
      const key = $('resort-select').value;
      const resortInfo = resortMap[key];
      const cacheKey = `${dataFolder}-${key}`;
      if (!resortInfo || !cachedIndex[cacheKey]) return;
      const resortData = cachedIndex[cacheKey];
      const dateKey = deriveDateKey(resortData);
      const tz = resortInfo.timezone || 'UTC';
      fetchHistory(key, dateKey).then((history) => renderRows(resortData, history, tz));
    });

    $('data-folder-select').addEventListener('change', async (e) => {
      dataFolder = e.target.value;
      localStorage.setItem('dataFolder', dataFolder);
      // Clear caches
      historyCache.clear();
      Object.keys(cachedIndex).forEach(key => delete cachedIndex[key]);
      // Reload current resort if one is selected
      const key = $('resort-select').value;
      if (key) {
        await loadResort(key);
      }
    });

    init();
  </script>
</body>
</html>
