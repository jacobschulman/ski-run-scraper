<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Lift Wait Monitor</title>
  <style>
    :root {
      --bg: #0c1a2b;
      --panel: #0f243a;
      --card: rgba(255, 255, 255, 0.03);
      --border: rgba(255, 255, 255, 0.08);
      --text: #e9f1ff;
      --muted: #9bb3d1;
      --accent: #7bd8ff;
      --accent-2: #9b7bff;
      --positive: #7bffc3;
      --negative: #ff8f87;
      --chip: rgba(255, 255, 255, 0.06);
      --shadow: 0 10px 50px rgba(0, 0, 0, 0.4);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at 20% 20%, rgba(123, 216, 255, 0.08), transparent 30%), radial-gradient(circle at 80% 0%, rgba(155, 123, 255, 0.12), transparent 32%), var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 32px 18px 60px;
    }
    .page {
      max-width: 1200px;
      margin: 0 auto;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }
    h1 {
      margin: 0;
      font-size: 1.9rem;
      letter-spacing: -0.02em;
    }
    .subtitle {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 999px;
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      color: var(--text);
      font-size: 0.95rem;
      white-space: nowrap;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 14px;
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 6px;
      letter-spacing: 0.01em;
    }
    select, input {
      width: 100%;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      font-size: 1rem;
      box-shadow: var(--shadow);
      outline: none;
      transition: border-color 0.15s, background 0.15s;
    }
    select:focus, input:focus {
      border-color: var(--accent);
      background: rgba(255, 255, 255, 0.05);
    }
    .meta-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
    }
    .meta-pill {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 0.9rem;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    thead {
      background: linear-gradient(135deg, rgba(123, 216, 255, 0.12), rgba(155, 123, 255, 0.12));
    }
    th, td {
      text-align: left;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    th {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      font-weight: 700;
    }
    tbody tr:hover {
      background: rgba(255, 255, 255, 0.03);
    }
    .lift-name {
      font-weight: 600;
      letter-spacing: -0.01em;
      margin-bottom: 4px;
    }
    .lift-sub {
      color: var(--muted);
      font-size: 0.9rem;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 8px;
      background: var(--card);
      border: 1px solid var(--border);
      font-size: 0.9rem;
    }
    .status.open { color: var(--positive); border-color: rgba(123, 255, 195, 0.3); }
    .status.closed { color: var(--negative); border-color: rgba(255, 143, 135, 0.3); }
    .current-wait {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--text);
    }
    .current-meta {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 4px;
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      border-radius: 10px;
      background: var(--chip);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.9rem;
    }
    .chip time {
      color: var(--muted);
      font-size: 0.85rem;
    }
    .empty {
      padding: 18px;
      color: var(--muted);
      text-align: center;
    }
    .notice {
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.9rem;
    }
    @media (max-width: 720px) {
      .header { flex-direction: column; align-items: flex-start; }
      table { display: block; overflow-x: auto; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="header">
      <div>
        <h1>Live Lift Wait Monitor</h1>
        <p class="subtitle">Debug view for all resorts with live lift scraping. Pick a resort to see current waits plus the last few runs.</p>
      </div>
      <div class="pill" id="resort-count">Loading…</div>
    </div>

    <div class="controls">
      <div>
        <label for="resort-select">Resort</label>
        <select id="resort-select" aria-label="Choose resort"></select>
      </div>
      <div>
        <label for="lift-filter">Filter lifts (name or mountain)</label>
        <input id="lift-filter" type="search" placeholder="e.g. Gondola, Peak 8, Summit" aria-label="Filter lifts">
      </div>
    </div>

    <div class="meta-bar" id="meta-bar"></div>

    <div id="table-wrapper">
      <table id="lift-table" aria-live="polite">
        <thead>
          <tr>
            <th>Lift</th>
            <th>Status</th>
            <th>Current Wait</th>
            <th>Recent Runs</th>
          </tr>
        </thead>
        <tbody id="lift-rows">
          <tr><td colspan="4" class="empty">Loading live data…</td></tr>
        </tbody>
      </table>
      <div class="notice" id="notice"></div>
    </div>
  </div>

  <script>
    const latestUrl = 'latest-lifts.json';
    const historyDepth = 6;
    let latestData = {};
    let resortList = [];
    const historyCache = new Map();

    const $ = (id) => document.getElementById(id);

    const timeAgo = (iso) => {
      if (!iso) return '';
      const t = new Date(iso);
      if (Number.isNaN(t)) return '';
      const diffMs = Date.now() - t.getTime();
      const minutes = Math.max(0, Math.round(diffMs / 60000));
      if (minutes < 1) return 'just now';
      if (minutes < 60) return minutes + 'm ago';
      const hours = Math.floor(minutes / 60);
      const rem = minutes % 60;
      if (hours < 24) return rem ? hours + 'h ' + rem + 'm ago' : hours + 'h ago';
      const days = Math.floor(hours / 24);
      return days + 'd ' + (hours % 24) + 'h ago';
    };

    const formatClock = (iso) => {
      if (!iso) return '';
      const t = new Date(iso);
      if (Number.isNaN(t)) return '';
      return t.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    };

    const formatWait = (value) => {
      if (value === null || value === undefined) return '—';
      if (Number.isNaN(Number(value))) return String(value);
      return value + ' min';
    };

    const deriveDateKey = (resort) => {
      const fromGenerated = resort.generated ? resort.generated.split('T')[0] : null;
      const fromLift = resort.lifts && resort.lifts.length ? resort.lifts[0].lastUpdated?.split('T')[0] : null;
      return fromGenerated || fromLift || new Date().toISOString().slice(0, 10);
    };

    async function fetchHistory(resortKey, dateKey) {
      const cacheKey = resortKey + '-' + dateKey;
      if (historyCache.has(cacheKey)) return historyCache.get(cacheKey);

      const promise = (async () => {
        const parseNdjson = (text) => {
          const lines = text.trim().split('\\n').filter(Boolean);
          const parsed = [];
          for (const line of lines) {
            try { parsed.push(JSON.parse(line)); } catch (_) { /* ignore bad lines */ }
          }
          const history = {};
          for (let i = parsed.length - 1; i >= 0; i--) {
            const entry = parsed[i];
            if (!entry || !entry.liftId) continue;
            const bucket = history[entry.liftId] || (history[entry.liftId] = []);
            if (bucket.length >= historyDepth) continue;
            if (bucket.some(h => h.timestamp === entry.timestamp)) continue;
            bucket.push(entry);
          }
          return history;
        };

        const tryFetch = async (rangeBytes) => {
          const headers = rangeBytes ? { 'Range': `bytes=-${rangeBytes}` } : {};
          const res = await fetch(\`\${resortKey}/lifts/\${dateKey}.ndjson\`, { headers });
          if (!res.ok) throw new Error(\`NDJSON \${res.status}\`);
          return res.text();
        };

        try {
          let text;
          let usedTail = true;

          try {
            // First, try a tail fetch to avoid downloading the full file
            text = await tryFetch(120000); // ~120 KB from end
          } catch (tailErr) {
            usedTail = false;
            console.warn('Tail fetch failed; retrying full file', tailErr.message || tailErr);
            text = await tryFetch(); // full file
          }

          let history = parseNdjson(text);

          // If tail fetch didn't have enough depth, fetch the whole file once
          const hasDepth = Object.values(history).some(list => list.length >= historyDepth);
          if (usedTail && !hasDepth) {
            text = await tryFetch(); // full file
            history = parseNdjson(text);
          }
          return history;
        } catch (err) {
          console.warn('History fetch failed for', resortKey, dateKey, err);
          return {};
        }
      })();

      historyCache.set(cacheKey, promise);
      return promise;
    }

    function renderResortOptions() {
      const select = $('resort-select');
      select.innerHTML = '';
      const placeholder = document.createElement('option');
      placeholder.value = '';
      placeholder.textContent = 'Select a resort';
      placeholder.disabled = true;
      placeholder.selected = true;
      select.appendChild(placeholder);
      resortList.forEach(({ key, name }) => {
        const opt = document.createElement('option');
        opt.value = key;
        opt.textContent = name;
        select.appendChild(opt);
      });
    }

    function setMeta(resortKey) {
      const resort = latestData[resortKey];
      const metaBar = $('meta-bar');
      metaBar.innerHTML = '';
      if (!resort) return;

      const metaItems = [
        { label: 'Lifts', value: resort.liftCount || (resort.lifts ? resort.lifts.length : '—') },
        { label: 'Last scrape', value: resort.generated ? timeAgo(resort.generated) + ' · ' + formatClock(resort.generated) : '—' },
        { label: 'Data file', value: deriveDateKey(resort) + '.ndjson' }
      ];

      metaItems.forEach(item => {
        const pill = document.createElement('div');
        pill.className = 'meta-pill';
        pill.innerHTML = '<strong>' + item.label + '</strong> ' + item.value;
        metaBar.appendChild(pill);
      });
    }

    function renderRows(resortKey, history) {
      const tbody = $('lift-rows');
      const filter = $('lift-filter').value.trim().toLowerCase();
      const resort = latestData[resortKey];
      if (!resort || !resort.lifts) {
        tbody.innerHTML = '<tr><td colspan="4" class="empty">No lift data found.</td></tr>';
        return;
      }

      const lifts = [...resort.lifts].sort((a, b) => a.name.localeCompare(b.name));
      let shown = 0;
      tbody.innerHTML = '';

      for (const lift of lifts) {
        const text = (lift.name + ' ' + (lift.mountain || '')).toLowerCase();
        if (filter && !text.includes(filter)) continue;

        const tr = document.createElement('tr');

        const liftCell = document.createElement('td');
        liftCell.innerHTML = '<div class="lift-name">' + lift.name + '</div>' +
          '<div class="lift-sub">' + [lift.mountain || 'Unknown zone', lift.type || ''].filter(Boolean).join(' · ') + '</div>';
        tr.appendChild(liftCell);

        const statusCell = document.createElement('td');
        const status = document.createElement('span');
        status.className = 'status ' + (lift.status && lift.status.toLowerCase() === 'open' ? 'open' : 'closed');
        status.textContent = lift.status || '—';
        statusCell.appendChild(status);
        tr.appendChild(statusCell);

        const currentCell = document.createElement('td');
        const currentWait = document.createElement('div');
        currentWait.className = 'current-wait';
        currentWait.textContent = formatWait(lift.waitMinutes);
        const meta = document.createElement('div');
        meta.className = 'current-meta';
        meta.textContent = lift.lastUpdated ? 'as of ' + formatClock(lift.lastUpdated) + ' (' + timeAgo(lift.lastUpdated) + ')' : 'no timestamp';
        currentCell.appendChild(currentWait);
        currentCell.appendChild(meta);
        tr.appendChild(currentCell);

        const histCell = document.createElement('td');
        const chipsWrap = document.createElement('div');
        chipsWrap.className = 'chips';
        const hist = history[lift.liftId] || [];
        if (hist.length === 0) {
          histCell.innerHTML = '<div class="lift-sub">No recent runs found</div>';
        } else {
          hist.forEach((entry, idx) => {
            const chip = document.createElement('span');
            chip.className = 'chip';
            chip.innerHTML = '<strong>' + formatWait(entry.waitMinutes) + '</strong> <time>' + timeAgo(entry.timestamp) + '</time>';
            if (idx === 0 && lift.lastUpdated && lift.lastUpdated !== entry.timestamp) {
              chip.title = 'Latest NDJSON time differs from lastUpdated';
            }
            chipsWrap.appendChild(chip);
          });
          histCell.appendChild(chipsWrap);
        }
        tr.appendChild(histCell);

        tbody.appendChild(tr);
        shown++;
      }

      if (!shown) {
        tbody.innerHTML = '<tr><td colspan="4" class="empty">No lifts match that filter.</td></tr>';
      }

      $('notice').textContent = 'Showing ' + shown + ' of ' + lifts.length + ' lifts' + (filter ? ' (filtered)' : '') + '.';
    }

    async function loadResort(resortKey) {
      const resort = latestData[resortKey];
      if (!resort) return;

      setMeta(resortKey);
      $('notice').textContent = 'Loading recent runs…';

      const dateKey = deriveDateKey(resort);
      const history = await fetchHistory(resortKey, dateKey);
      renderRows(resortKey, history);
    }

    function applyQueryParam(resortKey) {
      const url = new URL(window.location.href);
      url.searchParams.set('resort', resortKey);
      window.history.replaceState({}, '', url);
    }

    async function init() {
      try {
        const res = await fetch(latestUrl);
        latestData = await res.json();
        resortList = Object.entries(latestData)
          .map(([key, value]) => ({ key, name: value.name || key }))
          .sort((a, b) => a.name.localeCompare(b.name));

        $('resort-count').textContent = resortList.length + ' resorts live';
        renderResortOptions();

        const params = new URLSearchParams(window.location.search);
        const requested = params.get('resort');
        const initial = requested && latestData[requested] ? requested : '';
        if (initial) {
          $('resort-select').value = initial;
          await loadResort(initial);
        } else {
          $('lift-rows').innerHTML = '<tr><td colspan="4" class="empty">Pick a resort to load live lift waits.</td></tr>';
          $('notice').textContent = 'Select a resort to load data.';
        }
      } catch (err) {
        console.error(err);
        $('lift-rows').innerHTML = '<tr><td colspan="4" class="empty">Failed to load latest-lifts.json</td></tr>';
        $('notice').textContent = 'Could not load the aggregated feed.';
      }
    }

    $('resort-select').addEventListener('change', async (e) => {
      const key = e.target.value;
      applyQueryParam(key);
      await loadResort(key);
    });

    $('lift-filter').addEventListener('input', () => {
      const key = $('resort-select').value;
      const resort = latestData[key];
      if (!resort) return;
      const dateKey = deriveDateKey(resort);
      fetchHistory(key, dateKey).then((history) => renderRows(key, history));
    });

    init();
  </script>
</body>
</html>
