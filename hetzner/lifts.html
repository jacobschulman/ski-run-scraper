<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hetzner Lift Monitor</title>
  <style>
    :root {
      --bg: #0c1a2b;
      --panel: #0f243a;
      --card: rgba(255, 255, 255, 0.03);
      --border: rgba(255, 255, 255, 0.08);
      --text: #e9f1ff;
      --muted: #9bb3d1;
      --accent: #7bd8ff;
      --accent-2: #9b7bff;
      --positive: #7bffc3;
      --negative: #ff8f87;
      --warning: #ffcc66;
      --shadow: 0 10px 50px rgba(0, 0, 0, 0.4);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at 20% 20%, rgba(123, 216, 255, 0.08), transparent 30%),
                  radial-gradient(circle at 80% 0%, rgba(155, 123, 255, 0.12), transparent 32%),
                  var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
    }
    .page { max-width: 1200px; margin: 0 auto; }
    h1 { margin: 0; font-size: 1.8rem; letter-spacing: -0.02em; }
    .subtitle { margin: 6px 0 0; color: var(--muted); font-size: 0.95rem; }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
    .back-link { color: var(--accent); text-decoration: none; font-size: 0.9rem; }
    .back-link:hover { text-decoration: underline; }

    .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 16px; }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }
    select, input[type="search"] {
      width: 100%; background: var(--card); color: var(--text); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px; font-size: 1rem; box-shadow: var(--shadow); outline: none;
    }
    select:focus, input:focus { border-color: var(--accent); background: rgba(255, 255, 255, 0.05); }

    .meta-bar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
    .meta-pill { background: var(--card); border: 1px solid var(--border); border-radius: 999px; padding: 8px 12px; font-size: 0.9rem; color: var(--muted); }

    table { width: 100%; border-collapse: collapse; background: rgba(255, 255, 255, 0.02); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
    thead { background: linear-gradient(135deg, rgba(123, 216, 255, 0.12), rgba(155, 123, 255, 0.12)); }
    th, td { text-align: left; padding: 14px 16px; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 700; }
    tbody tr:hover { background: rgba(255, 255, 255, 0.03); }

    .lift-name { font-weight: 600; margin-bottom: 4px; }
    .lift-sub { color: var(--muted); font-size: 0.9rem; }
    .status { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 8px; background: var(--card); border: 1px solid var(--border); font-size: 0.9rem; }
    .status.open { color: var(--positive); border-color: rgba(123, 255, 195, 0.3); }
    .status.closed { color: var(--negative); border-color: rgba(255, 143, 135, 0.3); }

    .current-wait { font-weight: 700; font-size: 1.1rem; }
    .current-meta { color: var(--muted); font-size: 0.9rem; margin-top: 4px; }

    .chips { display: flex; flex-direction: column; gap: 8px; }
    .chip { display: inline-flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 10px; background: var(--chip); border: 1px solid var(--border); font-size: 0.9rem; }
    .chip time { color: var(--muted); font-size: 0.85rem; }
    .chip.stale { opacity: 0.5; }

    .wait-graph { margin-top: 12px; width: 100%; height: 140px; background: rgba(0, 0, 0, 0.2); border-radius: 8px; padding: 8px; border: 1px solid var(--border); position: relative; }
    .graph-tooltip { position: absolute; padding: 6px 8px; background: rgba(12, 26, 43, 0.9); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 0.85rem; pointer-events: none; opacity: 0; transform: translate(-50%, -120%); white-space: nowrap; z-index: 2; }
    .wait-graph svg { display: block; width: 100%; height: 100%; }
    .graph-line { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .graph-area { fill: var(--accent); opacity: 0.15; }
    .graph-dot { fill: var(--accent); stroke: var(--bg); stroke-width: 1.5; cursor: pointer; }
    .graph-dot:hover { fill: var(--positive); }
    .graph-axis { stroke: rgba(255, 255, 255, 0.15); stroke-width: 1; }
    .graph-label { fill: var(--muted); font-size: 9px; }
    .max-wait { margin-top: 8px; color: var(--muted); font-size: 0.9rem; }

    .empty { padding: 18px; color: var(--muted); text-align: center; }
    .notice { margin-top: 10px; color: var(--muted); font-size: 0.9rem; }
    .checkbox-row { display: flex; align-items: center; gap: 8px; padding-top: 24px; }
    .checkbox-row input { width: auto; margin: 0; }
    .checkbox-row label { margin: 0; cursor: pointer; }

    @media (max-width: 860px) {
      .header { flex-direction: column; align-items: flex-start; }
      table, thead, tbody, th, td, tr { display: block; }
      thead { display: none; }
      tbody tr { margin-bottom: 12px; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
      td { border-bottom: 1px solid var(--border); padding: 12px 14px; }
      td:last-child { border-bottom: none; }
      td::before { content: attr(data-label); display: block; font-size: 0.8rem; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="header">
      <div>
        <a href="/" class="back-link">&larr; Back to Monitor</a>
        <h1>Hetzner Lift Monitor</h1>
        <p class="subtitle">Real-time lift wait times from Hetzner scraper. Only shows data from operating hours.</p>
      </div>
    </div>

    <div class="controls">
      <div>
        <label for="resort-select">Resort</label>
        <select id="resort-select"><option value="">Loading...</option></select>
      </div>
      <div>
        <label for="lift-filter">Filter lifts</label>
        <input id="lift-filter" type="search" placeholder="e.g. Gondola, Summit">
      </div>
      <div class="checkbox-row">
        <input type="checkbox" id="open-only" checked>
        <label for="open-only">Open lifts only</label>
      </div>
    </div>

    <div class="meta-bar" id="meta-bar"></div>

    <table>
      <thead><tr><th>Lift</th><th>Status</th><th>Current Wait</th><th>Recent History</th></tr></thead>
      <tbody id="lift-rows"><tr><td colspan="4" class="empty">Select a resort to view lift data</td></tr></tbody>
    </table>
    <div class="notice" id="notice"></div>
  </div>

  <script>
    const API_BASE = window.location.origin;
    let resortData = {};
    let currentResort = '';

    const $ = id => document.getElementById(id);
    const formatWait = v => (v === null || v === undefined) ? '\u2014' : v + ' min';
    const formatTime = iso => {
      if (!iso) return '';
      const d = new Date(iso);
      return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    };
    const timeAgo = iso => {
      if (!iso) return '';
      const mins = Math.floor((Date.now() - new Date(iso)) / 60000);
      if (mins < 1) return 'just now';
      if (mins < 60) return mins + 'm ago';
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return hrs + 'h ' + (mins % 60) + 'm ago';
      return Math.floor(hrs / 24) + 'd ago';
    };

    // Parse time string like "08:30" or "3:30 PM" to minutes since midnight
    function parseTimeToMinutes(timeStr) {
      if (!timeStr) return null;
      const match = timeStr.match(/(\d+):(\d+)\s*(am|pm)?/i);
      if (!match) return null;
      let hours = parseInt(match[1], 10);
      const minutes = parseInt(match[2], 10);
      const meridiem = match[3]?.toLowerCase();
      if (meridiem === 'pm' && hours < 12) hours += 12;
      if (meridiem === 'am' && hours === 12) hours = 0;
      return hours * 60 + minutes;
    }

    // Check if a record is within operating hours (with 30 min buffer)
    // Uses localTime field from data (resort's local time) instead of parsing UTC timestamp
    function isWithinOperatingHours(entry, openTime, closeTime) {
      if (!openTime || !closeTime) return true; // If no hours, assume valid
      // Use localTime field if available (e.g., "14:50:00"), otherwise fall back to timestamp
      const localTime = entry.localTime || entry.timestamp;
      const mins = parseTimeToMinutes(localTime);
      if (mins === null) return true;
      const open = parseTimeToMinutes(openTime);
      const close = parseTimeToMinutes(closeTime);
      if (open === null || close === null) return true;
      // Add 30 min buffer before open and after close
      return mins >= (open - 30) && mins <= (close + 30);
    }

    // Filter history to only include entries during operating hours with actual data
    function filterRelevantHistory(history, openTime, closeTime) {
      return history.filter(entry => {
        // Must have actual wait time data or be "Open" status
        const hasData = entry.waitMinutes !== null && entry.waitMinutes !== undefined;
        const isOpen = entry.status?.toLowerCase() === 'open';
        if (!hasData && !isOpen) return false;
        // Must be within operating hours
        return isWithinOperatingHours(entry, openTime, closeTime);
      });
    }

    function createWaitGraph(history, openTime, closeTime) {
      const validHistory = filterRelevantHistory(history, openTime, closeTime)
        .filter(e => e.waitMinutes !== null && e.waitMinutes >= 0);

      if (validHistory.length === 0) return null;

      const dataPoints = validHistory.map(entry => {
        // Use localTime field (resort's local time) for x-axis positioning
        const localTime = entry.localTime || entry.timestamp;
        const timeMins = parseTimeToMinutes(localTime) || 0;
        return {
          time: timeMins,
          wait: entry.waitMinutes,
          timestamp: entry.timestamp
        };
      }).sort((a, b) => a.time - b.time);

      const openMins = parseTimeToMinutes(openTime) || 480;
      const closeMins = parseTimeToMinutes(closeTime) || 960;
      const minTime = Math.min(openMins, ...dataPoints.map(p => p.time));
      const maxTime = Math.max(closeMins, ...dataPoints.map(p => p.time));
      const maxWait = Math.max(...dataPoints.map(p => p.wait), 1);

      const width = 300, height = 120;
      const pad = { top: 8, right: 8, bottom: 18, left: 28 };
      const gw = width - pad.left - pad.right;
      const gh = height - pad.top - pad.bottom;
      const xScale = m => pad.left + ((m - minTime) / (maxTime - minTime)) * gw;
      const yScale = w => pad.top + gh - ((w / maxWait) * gh);

      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('viewBox', `0 0 ${width} ${height}`);

      // Axes
      ['line', 'line'].forEach((_, i) => {
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('class', 'graph-axis');
        if (i === 0) {
          line.setAttribute('x1', pad.left); line.setAttribute('y1', pad.top + gh);
          line.setAttribute('x2', width - pad.right); line.setAttribute('y2', pad.top + gh);
        } else {
          line.setAttribute('x1', pad.left); line.setAttribute('y1', pad.top);
          line.setAttribute('x2', pad.left); line.setAttribute('y2', pad.top + gh);
        }
        svg.appendChild(line);
      });

      // Labels
      [[pad.left, 'start', openTime || '8:00'], [width - pad.right, 'end', closeTime || '4:00']].forEach(([x, anchor, text]) => {
        const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        label.setAttribute('class', 'graph-label');
        label.setAttribute('x', x); label.setAttribute('y', height - 2);
        label.setAttribute('text-anchor', anchor);
        label.textContent = text;
        svg.appendChild(label);
      });

      const maxLabel = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      maxLabel.setAttribute('class', 'graph-label');
      maxLabel.setAttribute('x', 2); maxLabel.setAttribute('y', pad.top + 10);
      maxLabel.textContent = maxWait + 'm';
      svg.appendChild(maxLabel);

      // Area
      if (dataPoints.length > 0) {
        const area = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        area.setAttribute('class', 'graph-area');
        area.setAttribute('d', `M${pad.left},${pad.top + gh} ${dataPoints.map(p => `L${xScale(p.time)},${yScale(p.wait)}`).join(' ')} L${xScale(dataPoints[dataPoints.length-1].time)},${pad.top + gh} Z`);
        svg.appendChild(area);
      }

      // Line
      if (dataPoints.length > 1) {
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        line.setAttribute('class', 'graph-line');
        line.setAttribute('d', dataPoints.map((p, i) => `${i === 0 ? 'M' : 'L'}${xScale(p.time)},${yScale(p.wait)}`).join(' '));
        svg.appendChild(line);
      }

      // Dots
      dataPoints.forEach(p => {
        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('class', 'graph-dot');
        circle.setAttribute('cx', xScale(p.time)); circle.setAttribute('cy', yScale(p.wait));
        circle.setAttribute('r', 3);
        circle.dataset.wait = p.wait; circle.dataset.time = formatTime(p.timestamp);
        const title = document.createElementNS('http://www.w3.org/2000/svg', 'title');
        title.textContent = `${formatTime(p.timestamp)} - ${p.wait} min`;
        circle.appendChild(title);
        svg.appendChild(circle);
      });

      return svg;
    }

    async function loadResorts() {
      try {
        const res = await fetch(`${API_BASE}/data/latest-lifts.json`);
        const data = await res.json();
        resortData = data.resorts || {};

        const select = $('resort-select');
        select.innerHTML = '<option value="">Select a resort</option>';

        Object.keys(resortData).sort().forEach(key => {
          const opt = document.createElement('option');
          opt.value = key;
          opt.textContent = key;
          select.appendChild(opt);
        });

        // Check URL param
        const params = new URLSearchParams(window.location.search);
        const requested = params.get('resort');
        if (requested && resortData[requested]) {
          select.value = requested;
          renderResort(requested);
        }
      } catch (err) {
        $('notice').textContent = 'Failed to load resort data: ' + err.message;
      }
    }

    async function fetchFullHistory(resortKey) {
      const today = new Date().toISOString().slice(0, 10);
      try {
        const res = await fetch(`${API_BASE}/data/${resortKey}/lifts/${today}.ndjson`);
        if (!res.ok) return {};
        const text = await res.text();
        const lines = text.trim().split('\n').filter(Boolean);
        const history = {};
        lines.forEach(line => {
          try {
            const entry = JSON.parse(line);
            const id = entry.name || entry.liftId;
            if (!history[id]) history[id] = [];
            history[id].push(entry);
          } catch (_) {}
        });
        // Sort each lift's history by timestamp descending
        Object.values(history).forEach(arr => arr.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp)));
        return history;
      } catch (_) {
        return {};
      }
    }

    async function renderResort(resortKey) {
      currentResort = resortKey;
      const data = resortData[resortKey];
      if (!data) return;

      // Update URL
      const url = new URL(window.location);
      url.searchParams.set('resort', resortKey);
      window.history.replaceState({}, '', url);

      // Meta bar
      const meta = $('meta-bar');
      meta.innerHTML = `
        <div class="meta-pill"><strong>Lifts:</strong> ${data.lifts?.length || 0}</div>
        <div class="meta-pill"><strong>Last update:</strong> ${timeAgo(data.timestamp)}</div>
      `;

      // Fetch full history for graphs
      const fullHistory = await fetchFullHistory(resortKey);

      renderLifts(data.lifts || [], fullHistory);
    }

    function renderLifts(lifts, fullHistory) {
      const tbody = $('lift-rows');
      const filter = $('lift-filter').value.toLowerCase();
      const openOnly = $('open-only').checked;

      // Sort: open first, then by name
      const sorted = [...lifts].sort((a, b) => {
        const aOpen = a.status?.toLowerCase() === 'open' ? 1 : 0;
        const bOpen = b.status?.toLowerCase() === 'open' ? 1 : 0;
        if (aOpen !== bOpen) return bOpen - aOpen;
        return (a.name || '').localeCompare(b.name || '');
      });

      tbody.innerHTML = '';
      let shown = 0;

      for (const lift of sorted) {
        const text = ((lift.name || '') + ' ' + (lift.mountain || '')).toLowerCase();
        if (filter && !text.includes(filter)) continue;

        const isOpen = lift.status?.toLowerCase() === 'open';
        if (openOnly && !isOpen) continue;

        const tr = document.createElement('tr');
        const history = fullHistory[lift.name] || [];
        const relevantHistory = filterRelevantHistory(history, lift.openTime, lift.closeTime);

        // Lift info
        const liftCell = document.createElement('td');
        liftCell.setAttribute('data-label', 'Lift');
        const meta = [lift.mountain, lift.type, lift.openTime && lift.closeTime ? `${lift.openTime} - ${lift.closeTime}` : null].filter(Boolean).join(' \u00b7 ');
        liftCell.innerHTML = `<div class="lift-name">${lift.name || 'Unknown'}</div><div class="lift-sub">${meta}</div>`;
        tr.appendChild(liftCell);

        // Status
        const statusCell = document.createElement('td');
        statusCell.setAttribute('data-label', 'Status');
        statusCell.innerHTML = `<span class="status ${isOpen ? 'open' : 'closed'}">${lift.status || '\u2014'}</span>`;
        tr.appendChild(statusCell);

        // Current wait with graph
        const waitCell = document.createElement('td');
        waitCell.setAttribute('data-label', 'Current Wait');
        waitCell.innerHTML = `<div class="current-wait">${formatWait(lift.waitMinutes)}</div><div class="current-meta">${timeAgo(lift.timestamp)}</div>`;

        const graph = createWaitGraph(history, lift.openTime, lift.closeTime);
        if (graph) {
          const container = document.createElement('div');
          container.className = 'wait-graph';
          container.appendChild(graph);
          waitCell.appendChild(container);

          // Find longest wait
          const longest = relevantHistory.reduce((max, e) => (!max || (e.waitMinutes || 0) > (max.waitMinutes || 0)) ? e : max, null);
          if (longest && longest.waitMinutes) {
            const maxEl = document.createElement('div');
            maxEl.className = 'max-wait';
            maxEl.textContent = `Peak: ${longest.waitMinutes} min at ${formatTime(longest.timestamp)}`;
            waitCell.appendChild(maxEl);
          }
        }
        tr.appendChild(waitCell);

        // Recent history (filtered to operating hours)
        const histCell = document.createElement('td');
        histCell.setAttribute('data-label', 'Recent History');
        const chips = document.createElement('div');
        chips.className = 'chips';

        // Show last 5 relevant entries
        relevantHistory.slice(0, 5).forEach(entry => {
          const chip = document.createElement('span');
          chip.className = 'chip';
          chip.innerHTML = `<strong>${formatWait(entry.waitMinutes)}</strong> <time>${timeAgo(entry.timestamp)}</time>`;
          chips.appendChild(chip);
        });

        if (relevantHistory.length === 0) {
          histCell.innerHTML = '<div class="lift-sub">No data during operating hours</div>';
        } else {
          histCell.appendChild(chips);
        }
        tr.appendChild(histCell);

        tbody.appendChild(tr);
        shown++;
      }

      if (shown === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="empty">No lifts match your filters</td></tr>';
      }
      $('notice').textContent = `Showing ${shown} of ${lifts.length} lifts`;
    }

    // Event listeners
    $('resort-select').addEventListener('change', e => {
      if (e.target.value) renderResort(e.target.value);
    });

    $('lift-filter').addEventListener('input', () => {
      if (currentResort && resortData[currentResort]) {
        fetchFullHistory(currentResort).then(history => {
          renderLifts(resortData[currentResort].lifts || [], history);
        });
      }
    });

    $('open-only').addEventListener('change', () => {
      if (currentResort && resortData[currentResort]) {
        fetchFullHistory(currentResort).then(history => {
          renderLifts(resortData[currentResort].lifts || [], history);
        });
      }
    });

    // Init
    loadResorts();
  </script>
</body>
</html>
