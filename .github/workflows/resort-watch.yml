name: Daily resort opening watch
on:
  schedule:
    - cron: '23 17 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: resort-watch
  cancel-in-progress: false
jobs:
  watch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/*
            /data/resort-watch.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - run: node --test tests/resort-watch.test.js
      - name: Check all configured resort feeds
        run: node scripts/audit-scrapers.js
      - name: Publish discovery status only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/build-resort-watch.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/resort-watch.json
          git commit -m 'data: refresh daily resort opening watch'
          git pull --rebase origin main
          git push origin HEAD:main
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resort-watch-evidence
          include-hidden-files: true
          path: .cache/scraper-audit/
          retention-days: 14
