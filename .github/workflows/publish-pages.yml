name: Rebuild existing GitHub Pages site

# Pages is configured to build main's repository root automatically on pushes.
# A second artifact deployment containing only data/ would drop the dashboards.
on:
  workflow_dispatch:

permissions:
  pages: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Request the existing branch-based Pages build
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: gh api --method POST "repos/$REPOSITORY/pages/builds"
