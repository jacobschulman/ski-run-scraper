name: Daily Terrain Scraper

on:
  schedule:
    # Run every 1 hour at :03 to avoid collisions with other workflows
    # Each resort's terrain is scraped once daily in the morning (grooming happens overnight)
    # Scraper checks timezone, season dates, and existing data before scraping
    # Snow reports are handled by snow-scraper.yml (runs hourly throughout the day)
    - cron: '3 */1 * * *'

  workflow_dispatch: # Allow manual triggering

concurrency:
  group: data-repo-push
  cancel-in-progress: false  # Queue workflows to prevent git push conflicts

permissions:
  contents: write  # Required to commit and push changes

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code repository (public)
        uses: actions/checkout@v4
        with:
          path: public-repo

      - name: Checkout data repository (new)
        uses: actions/checkout@v4
        with:
          repository: jacobschulman/ski-run-scraper-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data-repo

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: public-repo/package-lock.json

      - name: Install dependencies
        run: |
          cd public-repo
          npm install

      - name: Run Vail terrain scraper
        run: |
          cd public-repo
          node vail-scraper.js all terrain
        # Scrapes terrain/grooming data for all Vail Resorts using Puppeteer (once daily in AM)

      - name: Run Ikon terrain scraper
        run: |
          cd public-repo
          node ikon-scraper.js terrain
        # Scrapes terrain/grooming data for all Ikon Pass resorts using Inspector API (once daily in AM)

      - name: Run Canadian SkiBig3 scraper
        run: |
          cd public-repo
          node canadian-scraper.js
        # Scrapes Lake Louise, Sunshine Village, Mt Norquay using Puppeteer hybrid approach

      - name: Import terrain data to database
        run: |
          cd public-repo
          npm run db:import
        # Import scraped terrain JSON files into SQLite database for streak calculations

      - name: Generate trail data
        run: |
          cd public-repo
          npm run generate:trails:only all
        # Uses generate:trails:only since db:import already ran above

      - name: Generate terrain indexes
        run: |
          cd public-repo
          npm run generate:terrain-indexes

      - name: Generate aggregate data
        run: |
          cd public-repo
          node generate-aggregates.js
        # Generates daily mega recap with superlatives, rankings, and regional aggregates

      - name: Copy data to data repository
        run: |
          # Sync data from public repo to data repo
          rsync -av --delete public-repo/data/ data-repo/data/

      - name: Commit to PUBLIC repo (existing behavior)
        run: |
          cd public-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH_NAME="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"

          # Fetch latest to avoid conflicts with Hetzner scraper pushes
          git fetch origin "$BRANCH_NAME"
          git reset "origin/$BRANCH_NAME"

          # Stage all data changes
          git add data/

          # Check if there are changes
          if git diff --cached --quiet; then
            echo "No changes to commit in public repo"
            echo "has_public_changes=false" >> $GITHUB_ENV
          else
            git commit -m "Update ski data - $(date +'%Y-%m-%d')"
            git push origin "$BRANCH_NAME"
            echo "has_public_changes=true" >> $GITHUB_ENV
          fi

      - name: Commit to DATA repo (parallel)
        run: |
          cd data-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Retry loop: other scrapers may push to data repo during our run,
          # causing rebase conflicts. On each attempt, reset to remote HEAD,
          # re-sync from public repo (authoritative source), and try again.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            # Re-copy data from public repo (authoritative source)
            rsync -av --delete ../public-repo/data/ data/

            git add data/

            if git diff --cached --quiet; then
              echo "No changes to commit in data repo"
              break
            fi

            git commit -m "Update ski data - $(date +'%Y-%m-%d')"
            if git push origin main; then
              echo "✓ Data repo push succeeded on attempt $attempt"
              break
            fi

            echo "⚠ Push failed on attempt $attempt, retrying..."
            if [ "$attempt" -eq 3 ]; then
              echo "✗ Data repo push failed after 3 attempts"
              exit 1
            fi
            sleep 5
          done

      - name: Summary
        run: |
          if [ "${{ env.has_public_changes }}" = "true" ]; then
            echo "✓ Dual-commit successful: Updates pushed to both repos"
          else
            echo "✓ Scrape completed but no new data to commit"
          fi
