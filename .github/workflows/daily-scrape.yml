name: Daily Terrain Scraper

on:
  schedule:
    # Run every 1 hour to catch all resorts at their local 5-8 AM time
    # Each resort's terrain is scraped once daily in the morning (grooming happens overnight)
    # Scraper checks timezone, season dates, and existing data before scraping
    # Snow reports are handled by snow-scraper.yml (runs hourly throughout the day)
    - cron: '0 */1 * * *'

  workflow_dispatch: # Allow manual triggering

concurrency:
  group: scraper
  cancel-in-progress: false

permissions:
  contents: write  # Required to commit and push changes

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run Vail terrain scraper
        run: node vail-scraper.js all terrain
        # Scrapes terrain/grooming data for all Vail Resorts using Puppeteer (once daily in AM)

      - name: Run Ikon terrain scraper
        run: node ikon-scraper.js terrain
        # Scrapes terrain/grooming data for all Ikon Pass resorts using Inspector API (once daily in AM)

      - name: Import terrain data to database
        run: npm run db:import
        # Import scraped terrain JSON files into SQLite database for streak calculations

      - name: Generate trail data
        run: npm run generate:trails:only all
        # Uses generate:trails:only since db:import already ran above

      - name: Generate terrain indexes
        run: npm run generate:terrain-indexes

      - name: Generate aggregate data
        run: node generate-aggregates.js
        # Generates daily mega recap with superlatives, rankings, and regional aggregates

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code data/ || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit and push data
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git pull --rebase --autostash origin main
          git add data/
          git commit -m "Update ski data - $(date +'%Y-%m-%d')"
          git push

      - name: No changes detected
        if: steps.git-check.outputs.changes != 'true'
        run: echo "No new data to commit"
