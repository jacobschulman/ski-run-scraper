name: Snow Report Scraper

on:
  schedule:
    # Run every 4 hours to keep snow reports fresh
    # Snow conditions update overnight, not hourly; this reduces commits while keeping data fresh
    - cron: '0 */4 * * *'

  workflow_dispatch: # Allow manual triggering

concurrency:
  group: snow-scraper
  cancel-in-progress: false

permissions:
  contents: write  # Required to commit and push changes

jobs:
  scrape-snow:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run Vail snow scraper
        run: node snow-scraper.js vail
        # Scrapes snow reports for all Vail Resorts using Puppeteer (batched)

      - name: Run Ikon snow scraper
        run: node snow-scraper.js ikon
        # Scrapes snow reports for all Ikon Pass resorts using Inspector API (single call)

      - name: Run Canadian SkiBig3 scraper
        run: node canadian-scraper.js
        # Scrapes Lake Louise, Sunshine Village, Mt Norquay using Puppeteer hybrid approach

      - name: Generate aggregate data
        run: node generate-aggregates.js
        # Regenerate mega recap with latest snow data

      - name: Stage data changes
        run: |
          # Stage ALL data changes (snow, terrain, brief from Canadian scraper, aggregates)
          git add data/

      - name: Check for meaningful changes (not just timestamp/forecast updates)
        id: data-check
        run: |
          node smart-commit-check.js > /tmp/check-output.txt 2>&1
          source /tmp/check-output.txt
          echo "new_data=$new_data" >> $GITHUB_OUTPUT
          cat /tmp/check-output.txt

      - name: Commit and push data
        if: steps.data-check.outputs.new_data == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Get the current branch name
          BRANCH_NAME="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"

          # Pull with rebase to avoid conflicts
          git pull --rebase --autostash origin "$BRANCH_NAME"

          # Re-stage after rebase
          git add data/

          # Create commit with timestamp
          git commit -m "Update snow reports - $(date -u +'%Y-%m-%d %H:%M UTC')"

          # Push changes to the current branch
          git push origin "$BRANCH_NAME"

      - name: No meaningful changes detected
        if: steps.data-check.outputs.new_data != 'true'
        run: echo "✓ Scrape completed but no new snow data to commit (conditions unchanged since last run)"
