name: Snow Report Scraper

on:
  schedule:
    # Run every 4 hours at :07 to avoid collisions with other workflows
    # Snow conditions update overnight, not hourly; this reduces commits while keeping data fresh
    - cron: '7 */4 * * *'

  workflow_dispatch: # Allow manual triggering

concurrency:
  group: snow-scraper
  cancel-in-progress: false  # Separate group so lift/terrain scrapers can't cancel snow runs

permissions:
  contents: write  # Required to commit and push changes

jobs:
  scrape-snow:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code repository (public)
        uses: actions/checkout@v4
        with:
          path: public-repo

      - name: Checkout data repository (new)
        uses: actions/checkout@v4
        with:
          repository: jacobschulman/ski-run-scraper-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data-repo

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: public-repo/package-lock.json

      - name: Install dependencies
        run: |
          cd public-repo
          npm install

      - name: Run Vail snow scraper
        run: |
          cd public-repo
          node snow-scraper.js vail
        # Scrapes snow reports for all Vail Resorts using Puppeteer (batched)

      - name: Run Ikon snow scraper
        run: |
          cd public-repo
          node snow-scraper.js ikon
        # Scrapes snow reports for all Ikon Pass resorts using Inspector API (single call)

      - name: Run Canadian SkiBig3 scraper
        run: |
          cd public-repo
          node canadian-scraper.js
        # Scrapes Lake Louise, Sunshine Village, Mt Norquay using Puppeteer hybrid approach

      - name: Generate aggregate data
        run: |
          cd public-repo
          node generate-aggregates.js
        # Regenerate mega recap with latest snow data

      - name: Copy data to data repository
        run: |
          # Sync data from public repo to data repo
          rsync -av --delete public-repo/data/ data-repo/data/

      - name: Commit to PUBLIC repo (existing behavior)
        run: |
          cd public-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage all data changes
          git add data/

          # Check if there are changes
          if git diff --cached --quiet; then
            echo "No changes to commit in public repo"
            echo "has_public_changes=false" >> $GITHUB_ENV
          else
            # Get the current branch name
            BRANCH_NAME="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"

            # Pull with rebase
            git pull --rebase --autostash origin "$BRANCH_NAME"

            # Re-stage after rebase
            git add data/

            # Commit and push
            git commit -m "Update snow reports - $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push origin "$BRANCH_NAME"
            echo "has_public_changes=true" >> $GITHUB_ENV
          fi

      - name: Commit to DATA repo (parallel)
        run: |
          cd data-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Pull latest changes first to avoid rebase conflicts
          git pull --rebase --autostash origin main

          # Stage all data files (re-stage after pull)
          git add data/

          # Check if there are changes
          if git diff --cached --quiet; then
            echo "No changes to commit in data repo"
          else
            # Commit and push
            git commit -m "Update snow reports - $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: Summary
        run: |
          if [ "${{ env.has_public_changes }}" = "true" ]; then
            echo "✓ Dual-commit successful: Updates pushed to both repos"
          else
            echo "✓ Scrape completed but no new data to commit (conditions unchanged since last run)"
          fi
