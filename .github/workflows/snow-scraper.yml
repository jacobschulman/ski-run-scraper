name: Snow Report Scraper

on:
  schedule:
    # Run every hour to keep snow reports fresh throughout the day
    # Snow conditions are updated hourly (unlike terrain which updates once daily)
    - cron: '0 */1 * * *'

  workflow_dispatch: # Allow manual triggering

concurrency:
  group: snow-scraper
  cancel-in-progress: false

permissions:
  contents: write  # Required to commit and push changes

jobs:
  scrape-snow:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run Vail snow scraper
        run: node snow-scraper.js vail
        # Scrapes snow reports for all Vail Resorts using Puppeteer (batched)

      - name: Run Ikon snow scraper
        run: node snow-scraper.js ikon
        # Scrapes snow reports for all Ikon Pass resorts using Inspector API (single call)

      - name: Run Canadian SkiBig3 scraper
        run: node canadian-scraper.js
        # Scrapes Lake Louise, Sunshine Village, Mt Norquay using Puppeteer hybrid approach

      - name: Generate aggregate data
        run: node generate-aggregates.js
        # Regenerate mega recap with latest snow data

      - name: Check for changes
        id: git-check
        run: |
          # Check if any data files changed (snow, terrain, brief from Canadian scraper, aggregates)
          git add -N data/  # Add intent-to-add for untracked files so diff can see them
          if git diff --quiet data/; then
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "No data changes detected"
          else
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "Data changes detected"
          fi

      - name: Commit and push data
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Get the current branch name
          BRANCH_NAME="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"

          # Stage ALL data changes (snow, terrain, brief from Canadian scraper, aggregates)
          # This prevents "untracked working tree files would be overwritten" errors
          git add data/

          # Now pull with rebase - staged files won't conflict
          git pull --rebase --autostash origin "$BRANCH_NAME"

          # Create commit with timestamp
          git commit -m "Update snow reports - $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "Nothing to commit"

          # Push changes to the current branch
          git push origin "$BRANCH_NAME"

      - name: No changes detected
        if: steps.git-check.outputs.changes != 'true'
        run: echo "✓ No snow data changes - reports unchanged since last run"
