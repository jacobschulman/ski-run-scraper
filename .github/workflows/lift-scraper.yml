name: Lift Wait-Time Scraper

on:
  schedule:
    # Run every 10 minutes during lift operating hours
    # Cron format: minute hour day month day-of-week
    # */10 means every 10 minutes (0, 10, 20, 30, 40, 50)
    # With optimized parallel processing, 35 resorts takes ~4-8 minutes
    # This ensures each run completes before the next one starts
    - cron: '*/10 * * * *'

  workflow_dispatch: # Allow manual triggering

concurrency:
  group: lift-scraper
  cancel-in-progress: false  # Let each run complete independently

permissions:
  contents: write  # Required to commit and push changes

jobs:
  scrape-lifts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run Vail lift scraper
        run: node vail-lift-scraper.js
        # Scrapes lift data for all Vail Resorts using Puppeteer

      - name: Run Ikon lift scraper
        run: node ikon-lift-scraper.js
        # Scrapes lift data for all Ikon Pass resorts using Inspector API

      - name: Generate lift JSON files
        run: npm run generate:lifts all

      - name: Generate latest lifts aggregation
        run: npm run generate:latest-lifts

      - name: Check for changes
        id: git-check
        run: |
          # Check if any lift data files changed
          if git diff --quiet data/**/lifts/ data/latest-lifts.json; then
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "No lift data changes detected"
          else
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "Lift data changes detected"
          fi

      - name: Commit and push lift data
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Get the current branch name
          BRANCH_NAME="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"

          # Pull latest changes with rebase to avoid conflicts
          # Pull from the current branch, not main
          git pull --rebase --autostash origin "$BRANCH_NAME"

          # Add lift data files, latest-lifts aggregation, and active resort cache
          git add data/**/lifts/ data/latest-lifts.json cache/

          # Create commit with timestamp
          git commit -m "Update lift wait times - $(date -u +'%Y-%m-%d %H:%M UTC')"

          # Push changes to the current branch
          git push origin "$BRANCH_NAME"

      - name: No changes detected
        if: steps.git-check.outputs.changes != 'true'
        run: echo "✓ No lift data changes - resorts likely outside operating hours"
