name: Lift Wait-Time Scraper

on:
  schedule:
    # Run every 10 minutes during lift operating hours
    # Cron format: minute hour day month day-of-week
    # */10 means every 10 minutes (0, 10, 20, 30, 40, 50)
    # With optimized parallel processing, 35 resorts takes ~4-8 minutes
    # This ensures each run completes before the next one starts
    - cron: '*/10 * * * *'

  workflow_dispatch: # Allow manual triggering

concurrency:
  group: data-repo-push
  cancel-in-progress: false  # Queue workflows to prevent git push conflicts

permissions:
  contents: write  # Required to commit and push changes

jobs:
  scrape-lifts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code repository (public)
        uses: actions/checkout@v4
        with:
          path: public-repo

      - name: Checkout data repository (new)
        uses: actions/checkout@v4
        with:
          repository: jacobschulman/ski-run-scraper-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data-repo

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: public-repo/package-lock.json

      - name: Install dependencies
        run: |
          cd public-repo
          npm install

      - name: Run Vail lift scraper
        run: |
          cd public-repo
          node vail-lift-scraper.js
        # Scrapes lift data for all Vail Resorts using Puppeteer

      - name: Run Ikon lift scraper
        run: |
          cd public-repo
          node ikon-lift-scraper.js
        # Scrapes lift data for all Ikon Pass resorts using Inspector API

      - name: Generate lift JSON files
        run: |
          cd public-repo
          npm run generate:lifts all

      - name: Generate latest lifts aggregation
        run: |
          cd public-repo
          npm run generate:latest-lifts

      - name: Copy data to data repository
        run: |
          # Sync data from public repo to data repo
          rsync -av --delete public-repo/data/ data-repo/data/

      - name: Commit to PUBLIC repo (existing behavior)
        run: |
          cd public-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage files
          git add data/**/lifts/ data/latest-lifts.json cache/

          # Check if there are changes
          if git diff --cached --quiet; then
            echo "No changes to commit in public repo"
            echo "has_public_changes=false" >> $GITHUB_ENV
          else
            # Get the current branch name
            BRANCH_NAME="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"

            # Pull latest changes with rebase to avoid conflicts
            git pull --rebase --autostash origin "$BRANCH_NAME"

            # Re-stage files after rebase
            git add data/**/lifts/ data/latest-lifts.json cache/

            # Create commit with timestamp
            git commit -m "Update lift wait times - $(date -u +'%Y-%m-%d %H:%M UTC')"

            # Push changes to the current branch
            git push origin "$BRANCH_NAME"
            echo "has_public_changes=true" >> $GITHUB_ENV
          fi

      - name: Commit to DATA repo (parallel)
        run: |
          cd data-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Retry loop: other scrapers may push to data repo during our run,
          # causing rebase conflicts. On each attempt, reset to remote HEAD,
          # re-sync from public repo (authoritative source), and try again.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            # Re-copy data from public repo (authoritative source)
            rsync -av --delete ../public-repo/data/ data/

            git add data/

            if git diff --cached --quiet; then
              echo "No changes to commit in data repo"
              break
            fi

            git commit -m "Update lift wait times - $(date -u +'%Y-%m-%d %H:%M UTC')"
            if git push origin main; then
              echo "✓ Data repo push succeeded on attempt $attempt"
              break
            fi

            echo "⚠ Push failed on attempt $attempt, retrying..."
            if [ "$attempt" -eq 3 ]; then
              echo "✗ Data repo push failed after 3 attempts"
              exit 1
            fi
            sleep 5
          done

      - name: Summary
        run: |
          if [ "${{ env.has_public_changes }}" = "true" ]; then
            echo "✓ Dual-commit successful: Updates pushed to both repos"
          else
            echo "✓ Scrape completed but no new data to commit (resorts likely closed or no wait time changes)"
          fi
