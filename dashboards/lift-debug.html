<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Live Lift Wait Times</title>

  <!-- Share preview / OG tags -->
  <meta property="og:title" content="Live Lift Wait Times">
  <meta property="og:description" content="Real-time ski lift wait times with trend arrows. Auto-refreshes every 30s.">
  <meta property="og:image" content="http://46.62.169.104:3000/resources/goomd-icon-1024.png">
  <meta property="og:image:width" content="1024">
  <meta property="og:image:height" content="1024">
  <meta property="og:type" content="website">
  <meta property="og:url" content="http://46.62.169.104:3000/dashboards/lift-debug.html">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Live Lifts">
  <meta name="theme-color" content="#0c1a2b">
  <link rel="apple-touch-icon" href="../resources/goomd-icon-1024.png">
  <link rel="icon" type="image/png" href="../resources/goomd-icon-1024.png">
  <style>
    :root {
      --bg: #0c1a2b;
      --panel: #0f243a;
      --card: rgba(255, 255, 255, 0.03);
      --border: rgba(255, 255, 255, 0.08);
      --text: #e9f1ff;
      --muted: #9bb3d1;
      --accent: #7bd8ff;
      --positive: #7bffc3;
      --negative: #ff8f87;
      --warning: #ffcc66;
      --chip: rgba(255, 255, 255, 0.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 14px;
      -webkit-text-size-adjust: none;
      line-height: 1.4;
    }

    /* ── Header ── */
    .page-header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 8px 12px;
    }
    .header-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-title {
      font-weight: 700;
      font-size: 16px;
      white-space: nowrap;
    }
    .header-sep {
      color: var(--muted);
      font-weight: 300;
    }
    .header-asof {
      font-size: 13px;
      color: var(--muted);
      white-space: nowrap;
    }
    .header-asof .fresh { color: var(--positive); }
    .header-asof .stale { color: var(--warning); }
    .header-asof .old { color: var(--negative); }
    .header-spacer { flex: 1; }
    .gear-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      padding: 4px 7px;
      cursor: pointer;
      font-size: 15px;
      line-height: 1;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .gear-btn:hover, .gear-btn.active { color: var(--accent); border-color: var(--accent); }
    .header-row2 {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 2px;
    }
    .header-meta {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }

    /* ── Settings Panel ── */
    .settings-panel {
      display: none;
      padding: 10px 12px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    .settings-panel.open { display: block; }
    .settings-row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    .settings-row + .settings-row { margin-top: 8px; }
    .settings-panel select {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 14px;
      font-family: inherit;
      flex: 1;
      min-width: 0;
    }
    .settings-panel select:focus { outline: none; border-color: var(--accent); }
    .settings-panel label {
      display: flex;
      align-items: center;
      gap: 4px;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
      cursor: pointer;
    }
    .settings-panel input[type="checkbox"] { width: 16px; height: 16px; margin: 0; }

    /* ── Lift List ── */
    .lift-list { padding: 0; }
    .lift-row {
      padding: 6px 12px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .lift-row:nth-child(even) { background: rgba(255,255,255,0.015); }
    .lift-row:active { background: rgba(255,255,255,0.04); }
    .lift-row.pinned { background: rgba(123, 216, 255, 0.05); border-left: 3px solid var(--accent); padding-left: 9px; }
    .lift-row.pinned:nth-child(even) { background: rgba(123, 216, 255, 0.07); }
    .lift-header {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .pin-icon {
      font-size: 10px;
      color: var(--accent);
      flex-shrink: 0;
      opacity: 0;
      transition: opacity 0.15s;
      width: 12px;
      text-align: center;
    }
    .lift-row.pinned .pin-icon { opacity: 1; }
    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot.open { background: var(--positive); }
    .dot.closed { background: var(--negative); }
    .dot.hold { background: var(--warning); }
    .lift-name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 600;
      font-size: 16px;
    }
    .wait-block {
      display: flex;
      align-items: center;
      gap: 3px;
      flex-shrink: 0;
    }
    .trend-arrow {
      font-size: 14px;
      font-weight: 700;
    }
    .trend-arrow.up { color: var(--negative); }
    .trend-arrow.down { color: var(--positive); }
    .trend-arrow.flat { color: var(--muted); font-size: 10px; }
    .current-wait {
      font-weight: 800;
      font-size: 22px;
      white-space: nowrap;
      color: var(--accent);
      letter-spacing: -0.02em;
    }
    .current-wait.zero { color: var(--positive); }
    .current-wait.high { color: var(--warning); }
    .current-wait.very-high { color: var(--negative); }
    .current-wait.na { color: var(--muted); font-weight: 400; font-size: 14px; }
    .prev-line {
      font-size: 11px;
      color: var(--muted);
      padding-left: 26px;
      margin-top: 1px;
    }
    .prev-line .val { color: var(--text); font-weight: 600; }
    .empty-msg {
      padding: 24px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }
    .settings-hint {
      font-size: 12px;
      color: var(--muted);
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="page-header">
    <div class="header-row">
      <span class="header-title" id="header-title">Live Lifts</span>
      <span class="header-sep" id="header-sep"></span>
      <span class="header-asof" id="header-asof"></span>
      <span class="header-spacer"></span>
      <button class="gear-btn" id="gear-btn" title="Settings">&#9881;</button>
    </div>
    <div class="header-row2">
      <span class="header-meta" id="header-meta"></span>
      <span class="header-spacer"></span>
      <span class="header-meta" id="header-source"></span>
    </div>
  </div>

  <div class="settings-panel" id="settings-panel">
    <div class="settings-row">
      <select id="resort-select" aria-label="Resort"></select>
    </div>
    <div class="settings-row">
      <label><input type="checkbox" id="open-only" checked> Open only</label>
      <label><input type="checkbox" id="wait-only" checked> With waits</label>
      <label><input type="checkbox" id="auto-refresh" checked> Auto-refresh (30s)</label>
    </div>
    <div class="settings-row">
      <span class="settings-hint">Tap a lift to pin it to the top. Pins are saved per resort.</span>
    </div>
  </div>

  <div class="lift-list" id="lift-list">
    <div class="empty-msg">Loading...</div>
  </div>

  <script src="shared/data-source-config.js" onerror="console.error('data-source-config.js not found')"></script>
  <script>
    const READINGS_TO_SHOW = 2;
    const AUTO_REFRESH_MS = 30000;
    const PINS_STORAGE_KEY = 'lift-debug-pins';
    let resorts = [];
    let resortMap = {};
    let autoRefreshInterval = null;
    let lastScrapeTime = null;
    let currentTz = 'UTC';
    let updatedTickInterval = null;
    // Last-fetched data for re-renders (filter/pin changes) without network calls
    let lastResortData = null;
    let lastHistory = null;
    let lastTz = 'UTC';

    // ── Pinned lifts (per resort, in localStorage) ──
    function getPins(resortKey) {
      try {
        const all = JSON.parse(localStorage.getItem(PINS_STORAGE_KEY) || '{}');
        return all[resortKey] || [];
      } catch (_) { return []; }
    }
    function setPins(resortKey, pins) {
      try {
        const all = JSON.parse(localStorage.getItem(PINS_STORAGE_KEY) || '{}');
        all[resortKey] = pins;
        localStorage.setItem(PINS_STORAGE_KEY, JSON.stringify(all));
      } catch (_) {}
    }
    function togglePin(resortKey, liftId) {
      const pins = getPins(resortKey);
      const idx = pins.indexOf(liftId);
      if (idx >= 0) pins.splice(idx, 1);
      else pins.push(liftId);
      setPins(resortKey, pins);
    }

    const $ = id => document.getElementById(id);
    const slugify = s => (s || '').toLowerCase().replace(/[^\w\s-]/g, '').replace(/\s+/g, '-').replace(/--+/g, '-').trim();
    const canonicalLiftId = lift => lift ? `${slugify(lift.mountain || 'unknown')}:${slugify(lift.name || 'unknown')}` : '';

    // Cache-busting fetch wrapper — prevents mobile browsers from serving stale responses
    function fetchFresh(url) {
      const bustUrl = url + (url.includes('?') ? '&' : '?') + '_t=' + Date.now();
      return fetch(bustUrl, { cache: 'no-store' });
    }

    const timeAgoLong = iso => {
      if (!iso) return '';
      const d = new Date(iso);
      if (isNaN(d)) return '';
      const m = Math.max(0, Math.round((Date.now() - d.getTime()) / 60000));
      if (m < 1) return 'just now';
      if (m === 1) return '1 min ago';
      if (m < 60) return m + ' mins ago';
      const h = Math.floor(m / 60);
      const rm = m % 60;
      if (h < 24) {
        if (rm === 0) return h === 1 ? '1 hr ago' : h + ' hrs ago';
        return h + 'h ' + rm + 'm ago';
      }
      const days = Math.floor(h / 24);
      return days === 1 ? '1 day ago' : days + ' days ago';
    };

    const formatClock = (iso, tz) => {
      if (!iso) return '';
      const t = new Date(iso);
      if (isNaN(t)) return '';
      return new Intl.DateTimeFormat([], { hour: 'numeric', minute: '2-digit', timeZone: tz || 'UTC' }).format(t);
    };

    const deriveDateKey = resort => {
      const fg = resort.generated ? resort.generated.split('T')[0] : null;
      const fl = resort.lifts?.length ? resort.lifts[0].lastUpdated?.split('T')[0] : null;
      return fg || fl || new Date().toISOString().slice(0, 10);
    };

    function updateAsOf() {
      const el = $('header-asof');
      const sep = $('header-sep');
      if (!lastScrapeTime) { el.textContent = ''; sep.textContent = ''; return; }
      sep.textContent = '\u2014';
      const d = new Date(lastScrapeTime);
      const m = Math.max(0, Math.round((Date.now() - d.getTime()) / 60000));
      let cls;
      if (m <= 5) cls = 'fresh';
      else if (m <= 15) cls = 'stale';
      else cls = 'old';
      const clockStr = formatClock(lastScrapeTime, currentTz);
      const agoStr = timeAgoLong(lastScrapeTime);
      el.innerHTML = `As of <span class="${cls}">${clockStr} (${agoStr})</span>`;
    }

    function startUpdatedTick() {
      if (updatedTickInterval) clearInterval(updatedTickInterval);
      updatedTickInterval = setInterval(updateAsOf, 10000);
    }

    async function fetchHistory(resortKey, dateKey) {
      try {
        const url = dataSourceManager.buildDataUrl(`data/${resortKey}/lifts/${dateKey}.ndjson`);
        const res = await fetchFresh(url);
        if (!res.ok) throw new Error(`${res.status}`);
        const text = await res.text();
        const lines = text.trim().split('\n').filter(Boolean);
        const history = {};
        for (let i = lines.length - 1; i >= 0; i--) {
          try {
            const entry = JSON.parse(lines[i]);
            const id = canonicalLiftId(entry);
            if (!history[id]) history[id] = [];
            if (!history[id].some(h => h.timestamp === entry.timestamp)) {
              history[id].push({ ...entry, liftId: id });
            }
          } catch (_) {}
        }
        return history;
      } catch (e) {
        console.error('fetchHistory error:', e);
        return {};
      }
    }

    // Cache-busting wrapper for dataSourceManager.fetchData
    async function fetchDataFresh(path) {
      const source = dataSourceManager.getCurrentSource();
      const isConfig = path === 'config.json' || path === '../config.json';
      if (isConfig) return dataSourceManager.fetchData(path);
      const url = dataSourceManager.buildDataUrl(path);
      const res = await fetchFresh(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    }

    function renderResortOptions() {
      const sel = $('resort-select');
      sel.innerHTML = '';
      resorts.forEach(({ key, name }) => {
        const o = document.createElement('option');
        o.value = key;
        o.textContent = name;
        sel.appendChild(o);
      });
    }

    function updateHeader(resortKey, resortData, tz) {
      const info = resortMap[resortKey];
      const name = info?.name || resortKey;
      $('header-title').textContent = name + ' Live Lifts';
      document.title = name + ' Live Lifts';

      lastScrapeTime = resortData?.generated || null;
      currentTz = tz;
      updateAsOf();

      const liftCount = resortData?.lifts?.length || 0;
      $('header-meta').textContent = liftCount + ' lifts';

      const source = dataSourceManager.getCurrentSource();
      $('header-source').textContent = source.name;
    }

    function render(resortData, history, tz) {
      const resortKey = $('resort-select').value;
      const list = $('lift-list');
      const openOnly = $('open-only').checked;
      const waitOnly = $('wait-only').checked;
      const pins = getPins(resortKey);

      const liftMap = new Map();
      const addLift = lift => {
        if (!lift) return;
        const id = canonicalLiftId(lift);
        const existing = liftMap.get(id);
        if (!existing) { liftMap.set(id, { ...lift, liftId: id }); return; }
        const m = { ...existing };
        if (lift.status) m.status = lift.status;
        if (lift.lastUpdated && (!m.lastUpdated || new Date(lift.lastUpdated) > new Date(m.lastUpdated))) {
          m.lastUpdated = lift.lastUpdated;
          m.waitMinutes = lift.waitMinutes !== undefined ? lift.waitMinutes : m.waitMinutes;
        }
        m.openTime = m.openTime || lift.openTime;
        m.closeTime = m.closeTime || lift.closeTime;
        m.mountain = m.mountain || lift.mountain;
        m.type = m.type || lift.type;
        m.name = m.name || lift.name;
        liftMap.set(id, m);
      };

      (resortData?.lifts || []).forEach(addLift);
      Object.keys(history).forEach(id => {
        const latest = history[id]?.[0];
        if (latest) addLift({ ...latest, liftId: id });
      });

      const hasWaitData = id => {
        const h = history[id] || [];
        return h.some(e => e.waitMinutes !== null && e.waitMinutes !== undefined);
      };

      let lifts = Array.from(liftMap.values())
        .sort((a, b) => {
          const ap = pins.includes(a.liftId) ? 1 : 0;
          const bp = pins.includes(b.liftId) ? 1 : 0;
          if (ap !== bp) return bp - ap;
          const ao = a.status?.toLowerCase() === 'open' ? 1 : 0;
          const bo = b.status?.toLowerCase() === 'open' ? 1 : 0;
          if (ao !== bo) return bo - ao;
          const aw = hasWaitData(a.liftId) ? 1 : 0;
          const bw = hasWaitData(b.liftId) ? 1 : 0;
          if (aw !== bw) return bw - aw;
          return (a.name || '').localeCompare(b.name || '');
        });

      let html = '';
      let shown = 0;

      for (const lift of lifts) {
        const hist = history[lift.liftId] || [];
        const latest = hist[0];
        const display = { ...lift };
        if (latest) {
          display.waitMinutes = latest.waitMinutes;
          display.status = latest.status || display.status;
          display.lastUpdated = latest.timestamp;
        }

        const isOpen = display.status?.toLowerCase() === 'open';
        if (openOnly && !isOpen) continue;
        if (waitOnly && !hasWaitData(lift.liftId)) continue;

        const statusClass = display.status?.toLowerCase() === 'open' ? 'open'
          : display.status?.toLowerCase().includes('hold') ? 'hold' : 'closed';
        const w = display.waitMinutes;
        const hasWait = w !== null && w !== undefined;
        let waitClass = 'na';
        if (hasWait) {
          waitClass = w === 0 ? 'zero' : w >= 15 ? 'very-high' : w >= 8 ? 'high' : '';
        }
        const waitText = hasWait ? w + 'm' : '--';
        const isPinned = pins.includes(lift.liftId);

        // Trend arrow: compare current wait to the previous reading
        let trendHtml = '';
        if (hasWait && hist.length >= 2) {
          const prevWait = hist[1].waitMinutes;
          if (prevWait !== null && prevWait !== undefined) {
            if (w > prevWait) trendHtml = '<span class="trend-arrow up">\u2191</span>';
            else if (w < prevWait) trendHtml = '<span class="trend-arrow down">\u2193</span>';
            else trendHtml = '<span class="trend-arrow flat">=</span>';
          }
        }

        // Compact prev line
        let prevHtml = '';
        const prev = hist.slice(1, 1 + READINGS_TO_SHOW);
        if (prev.length > 0) {
          const parts = prev.map(r => {
            const val = r.waitMinutes !== null && r.waitMinutes !== undefined ? r.waitMinutes + 'm' : '--';
            return `<span class="val">${val}</span> ${timeAgoLong(r.timestamp)}`;
          });
          prevHtml = `<div class="prev-line">prev: ${parts.join(', ')}</div>`;
        }

        html += `<div class="lift-row${isPinned ? ' pinned' : ''}" data-lift-id="${lift.liftId}">
          <div class="lift-header">
            <span class="pin-icon">\u25C6</span>
            <span class="dot ${statusClass}"></span>
            <span class="lift-name">${display.name}</span>
            <span class="wait-block">${trendHtml}<span class="current-wait ${waitClass}">${waitText}</span></span>
          </div>
          ${prevHtml}
        </div>`;
        shown++;
      }

      if (!shown) {
        html = '<div class="empty-msg">No lifts match filters.</div>';
      }

      list.innerHTML = html;

      list.querySelectorAll('.lift-row[data-lift-id]').forEach(row => {
        row.addEventListener('click', () => {
          togglePin(resortKey, row.dataset.liftId);
          rerender();
        });
      });
    }

    async function loadResort(resortKey) {
      const info = resortMap[resortKey];
      if (!info) return;
      const tz = info.timezone || 'UTC';

      try {
        // Always fetch fresh — no JS caching
        const resortData = await fetchDataFresh(`data/${resortKey}/lifts/index.json`);
        const dateKey = deriveDateKey(resortData);
        const history = await fetchHistory(resortKey, dateKey);

        // Store for rerender (filter/pin changes without network)
        lastResortData = resortData;
        lastHistory = history;
        lastTz = tz;

        updateHeader(resortKey, resortData, tz);
        render(resortData, history, tz);
      } catch (e) {
        $('lift-list').innerHTML = '<div class="empty-msg">Error: ' + (e.message || e) + '</div>';
      }
    }

    function refreshCurrentResort() {
      const key = $('resort-select').value;
      if (!key) return;
      loadResort(key);
    }

    function rerender() {
      if (!lastResortData) return;
      render(lastResortData, lastHistory || {}, lastTz);
    }

    function startAutoRefresh() {
      stopAutoRefresh();
      if (!$('auto-refresh').checked) return;
      autoRefreshInterval = setInterval(refreshCurrentResort, AUTO_REFRESH_MS);
    }

    function stopAutoRefresh() {
      if (autoRefreshInterval) { clearInterval(autoRefreshInterval); autoRefreshInterval = null; }
    }

    async function init() {
      try {
        const config = await dataSourceManager.fetchData('config.json');
        resorts = (config.resorts || [])
          .filter(r => r.liftWaitTimesAvailable)
          .map(r => ({ key: r.key, name: r.name, timezone: r.timezone }))
          .sort((a, b) => a.name.localeCompare(b.name));
        resortMap = resorts.reduce((acc, r) => { acc[r.key] = r; return acc; }, {});

        renderResortOptions();

        const params = new URLSearchParams(window.location.search);
        const requested = params.get('resort');
        const initial = requested && resortMap[requested] ? requested : (resortMap['vail'] ? 'vail' : resorts[0]?.key);
        if (initial) {
          $('resort-select').value = initial;
          await loadResort(initial);
          startAutoRefresh();
          startUpdatedTick();
        }
      } catch (e) {
        $('lift-list').innerHTML = '<div class="empty-msg">Failed to load config.json</div>';
      }
    }

    // ── Event listeners ──
    $('gear-btn').addEventListener('click', () => {
      $('settings-panel').classList.toggle('open');
      $('gear-btn').classList.toggle('active');
    });

    $('resort-select').addEventListener('change', e => {
      const url = new URL(window.location.href);
      url.searchParams.set('resort', e.target.value);
      window.history.replaceState({}, '', url);
      loadResort(e.target.value);
      startAutoRefresh();
    });

    $('open-only').addEventListener('change', rerender);
    $('wait-only').addEventListener('change', rerender);
    $('auto-refresh').addEventListener('change', () => {
      $('auto-refresh').checked ? startAutoRefresh() : stopAutoRefresh();
    });

    init();
  </script>
</body>
</html>
