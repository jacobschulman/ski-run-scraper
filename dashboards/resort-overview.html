<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resort Data Overview</title>
  <link rel="stylesheet" href="shared/theme.css">
  <style>
    :root {
      --bg: #0b1a12;
      --panel: rgba(255, 255, 255, 0.02);
      --card: rgba(255, 255, 255, 0.04);
      --text: #e8f5ec;
      --muted: #9bb7a7;
      --accent: #6fe3b2;
      --accent-2: #74c7ff;
      --negative: #ff9c8f;
    }
    body {
      background:
        radial-gradient(circle at 18% 20%, rgba(111, 227, 178, 0.11), transparent 28%),
        radial-gradient(circle at 82% 0%, rgba(116, 199, 255, 0.15), transparent 30%),
        radial-gradient(circle at 50% 100%, rgba(111, 227, 178, 0.08), transparent 35%),
        var(--bg);
    }
    .page { max-width: 1400px; }
    .stats {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .stat-pill {
      display: inline-flex;
      flex-direction: column;
      padding: 12px 16px;
      border-radius: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      font-size: 0.85rem;
    }
    .stat-pill .stat-label {
      color: var(--muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }
    .stat-pill .stat-value {
      color: var(--accent);
      font-size: 1.1rem;
      font-weight: 600;
    }
    .table-container {
      background: var(--panel);
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    table {
      font-size: 0.9rem;
    }
    thead {
      background: var(--card);
      border-bottom: 1px solid var(--border);
    }
    th {
      padding: 14px 16px;
      font-weight: 600;
      color: var(--accent);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    th.center { text-align: center; }
    td {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
    }
    td.center { text-align: center; }
    tr:last-child td { border-bottom: none; }
    .resort-name {
      font-weight: 500;
      color: var(--text);
    }
    .resort-provider {
      display: inline-block;
      margin-left: 8px;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.7rem;
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.03em;
    }
    .provider-vail {
      background: rgba(111, 227, 178, 0.15);
      color: var(--accent);
    }
    .provider-ikon {
      background: rgba(116, 199, 255, 0.15);
      color: var(--accent-2);
    }
    .status-icon {
      display: inline-block;
      width: 24px;
      height: 24px;
      border-radius: 6px;
      text-align: center;
      line-height: 24px;
      font-weight: 700;
    }
    .status-yes {
      background: rgba(123, 255, 195, 0.15);
      color: var(--positive);
    }
    .status-no {
      background: rgba(255, 156, 143, 0.15);
      color: var(--negative);
      opacity: 0.4;
    }
    .file-count {
      color: var(--muted);
      font-size: 0.85rem;
    }
    a {
      color: var(--accent);
      text-decoration: none;
      transition: opacity 0.2s ease;
    }
    a:hover {
      opacity: 0.7;
    }
    .summary-bar {
      display: flex;
      gap: 24px;
      padding: 20px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .summary-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .summary-label {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .summary-value {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text);
    }
    .summary-percent {
      font-size: 0.9rem;
      color: var(--accent);
      margin-left: 8px;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="header">
      <div>
        <h1>Resort Data Overview</h1>
        <div class="subtitle">Complete status of all resorts in the database</div>
      </div>
      <div class="stats">
        <div class="stat-pill">
          <div class="stat-label">Total Resorts</div>
          <div class="stat-value" id="total-resorts">-</div>
        </div>
        <div class="stat-pill">
          <div class="stat-label">Vail Resorts</div>
          <div class="stat-value" id="vail-count">-</div>
        </div>
        <div class="stat-pill">
          <div class="stat-label">Ikon Resorts</div>
          <div class="stat-value" id="ikon-count">-</div>
        </div>
      </div>
    </div>

    <div class="table-container">
      <div class="summary-bar" id="summary-bar">
        <!-- Summary stats will be inserted here -->
      </div>
      <table>
        <thead>
          <tr>
            <th>Resort</th>
            <th class="center">Terrain</th>
            <th class="center">Snow Report</th>
            <th class="center">Lift Status</th>
            <th class="center">Live Wait Times</th>
            <th class="center">Daily Briefs</th>
            <th>Files</th>
          </tr>
        </thead>
        <tbody id="resort-table">
          <tr>
            <td colspan="7" style="text-align: center; padding: 40px; color: var(--muted);">
              Loading resort data...
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="shared/nav.js"></script>
  <script>
    initNav('overview');

    const dataFolder = '../data';

    async function loadResortData() {
      try {
        const response = await fetch(`${dataFolder}/index.json`);
        const data = await response.json();

        const resorts = Object.entries(data.resorts).map(([key, resort]) => ({
          key,
          ...resort
        }));

        // Calculate summary stats
        const total = resorts.length;
        const vailCount = resorts.filter(r => r.provider === 'vail').length;
        const ikonCount = resorts.filter(r => r.provider === 'ikon').length;

        const terrainCount = resorts.filter(r => r.dataCapabilities.terrainAvailable).length;
        const snowCount = resorts.filter(r => r.dataCapabilities.snowReportAvailable).length;
        const liftStatusCount = resorts.filter(r => r.dataCapabilities.liftStatusAvailable).length;
        const waitTimesCount = resorts.filter(r => r.dataCapabilities.liftWaitTimesAvailable).length;
        const briefsCount = resorts.filter(r => r.dataCapabilities.dailyBriefAvailable).length;

        // Update header stats
        document.getElementById('total-resorts').textContent = total;
        document.getElementById('vail-count').textContent = vailCount;
        document.getElementById('ikon-count').textContent = ikonCount;

        // Update summary bar
        const summaryBar = document.getElementById('summary-bar');
        summaryBar.innerHTML = `
          <div class="summary-item">
            <div class="summary-label">Terrain Data</div>
            <div class="summary-value">
              ${terrainCount}/${total}
              <span class="summary-percent">${Math.round(terrainCount/total*100)}%</span>
            </div>
          </div>
          <div class="summary-item">
            <div class="summary-label">Snow Reports</div>
            <div class="summary-value">
              ${snowCount}/${total}
              <span class="summary-percent">${Math.round(snowCount/total*100)}%</span>
            </div>
          </div>
          <div class="summary-item">
            <div class="summary-label">Lift Status</div>
            <div class="summary-value">
              ${liftStatusCount}/${total}
              <span class="summary-percent">${Math.round(liftStatusCount/total*100)}%</span>
            </div>
          </div>
          <div class="summary-item">
            <div class="summary-label">Live Wait Times</div>
            <div class="summary-value">
              ${waitTimesCount}/${total}
              <span class="summary-percent">${Math.round(waitTimesCount/total*100)}%</span>
            </div>
          </div>
          <div class="summary-item">
            <div class="summary-label">Daily Briefs</div>
            <div class="summary-value">
              ${briefsCount}/${total}
              <span class="summary-percent">${Math.round(briefsCount/total*100)}%</span>
            </div>
          </div>
        `;

        // Sort resorts by provider then name
        resorts.sort((a, b) => {
          if (a.provider !== b.provider) {
            return a.provider === 'vail' ? -1 : 1;
          }
          return a.name.localeCompare(b.name);
        });

        // Render table
        const tbody = document.getElementById('resort-table');
        tbody.innerHTML = resorts.map(resort => {
          const caps = resort.dataCapabilities;
          const providerClass = `provider-${resort.provider}`;

          const terrainLink = caps.terrainAvailable && resort.latest
            ? `<a href="${dataFolder}/${resort.key}/terrain/${resort.latest}" target="_blank">${statusIcon(true)}</a>`
            : statusIcon(false);

          const snowLink = caps.snowReportAvailable
            ? `<a href="${dataFolder}/${resort.key}/snow/" target="_blank">${statusIcon(true)}</a>`
            : statusIcon(false);

          const briefLink = caps.dailyBriefAvailable
            ? `<a href="${dataFolder}/${resort.key}/brief/" target="_blank">${statusIcon(true)}</a>`
            : statusIcon(false);

          const filesInfo = resort.count > 0
            ? `<span class="file-count">${resort.count} terrain files</span><br><a href="${dataFolder}/${resort.key}/terrain/" target="_blank">View all \u2192</a>`
            : `<span class="file-count" style="opacity: 0.4;">No terrain data</span>`;

          return `
            <tr>
              <td>
                <span class="resort-name">${resort.name}</span>
                <span class="resort-provider ${providerClass}">${resort.provider}</span>
              </td>
              <td class="center">${terrainLink}</td>
              <td class="center">${snowLink}</td>
              <td class="center">${statusIcon(caps.liftStatusAvailable)}</td>
              <td class="center">${statusIcon(caps.liftWaitTimesAvailable)}</td>
              <td class="center">${briefLink}</td>
              <td>${filesInfo}</td>
            </tr>
          `;
        }).join('');

      } catch (error) {
        console.error('Error loading resort data:', error);
        document.getElementById('resort-table').innerHTML = `
          <tr>
            <td colspan="7" style="text-align: center; padding: 40px; color: var(--negative);">
              Error loading data: ${error.message}
            </td>
          </tr>
        `;
      }
    }

    function statusIcon(available) {
      if (available) {
        return '<span class="status-icon status-yes">\u2713</span>';
      } else {
        return '<span class="status-icon status-no">\u2717</span>';
      }
    }

    loadResortData();
  </script>
</body>
</html>
