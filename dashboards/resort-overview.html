<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resort Data Overview</title>
  <link rel="stylesheet" href="shared/theme.css">
  <style>
    :root {
      --bg: #0b1a12;
      --panel: rgba(255, 255, 255, 0.02);
      --card: rgba(255, 255, 255, 0.04);
      --text: #e8f5ec;
      --muted: #9bb7a7;
      --accent: #6fe3b2;
      --accent-2: #74c7ff;
      --negative: #ff9c8f;
      --warning: #ffcc70;
    }
    body {
      background:
        radial-gradient(circle at 18% 20%, rgba(111, 227, 178, 0.11), transparent 28%),
        radial-gradient(circle at 82% 0%, rgba(116, 199, 255, 0.15), transparent 30%),
        radial-gradient(circle at 50% 100%, rgba(111, 227, 178, 0.08), transparent 35%),
        var(--bg);
    }
    .page { max-width: 1400px; }
    .stats {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .stat-pill {
      display: inline-flex;
      flex-direction: column;
      padding: 12px 16px;
      border-radius: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      font-size: 0.85rem;
    }
    .stat-pill .stat-label {
      color: var(--muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }
    .stat-pill .stat-value {
      color: var(--accent);
      font-size: 1.1rem;
      font-weight: 600;
    }

    /* Filter controls */
    .filter-bar {
      display: flex;
      gap: 12px;
      padding: 16px 20px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      align-items: center;
    }
    .filter-label {
      font-size: 0.8rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-right: 8px;
    }
    .filter-btn {
      padding: 8px 14px;
      border-radius: 8px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }
    .filter-btn:hover {
      border-color: var(--accent);
      color: var(--text);
    }
    .filter-btn.active {
      background: rgba(111, 227, 178, 0.15);
      border-color: var(--accent);
      color: var(--accent);
    }
    .filter-btn.filter-missing {
      border-color: rgba(255, 156, 143, 0.4);
    }
    .filter-btn.filter-missing:hover {
      border-color: var(--negative);
      color: var(--negative);
    }
    .filter-btn.filter-missing.active {
      background: rgba(255, 156, 143, 0.15);
      border-color: var(--negative);
      color: var(--negative);
    }
    .filter-count {
      font-size: 0.75rem;
      opacity: 0.7;
      margin-left: 4px;
    }
    .filter-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .filter-divider {
      width: 1px;
      height: 24px;
      background: var(--border);
      margin: 0 8px;
    }

    .table-container {
      background: var(--panel);
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .table-scroll {
      max-height: calc(100vh - 320px);
      overflow-y: auto;
    }
    table {
      font-size: 0.9rem;
      width: 100%;
      border-collapse: collapse;
    }
    thead {
      background: var(--card);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    thead::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: var(--border);
    }
    th {
      padding: 14px 16px;
      font-weight: 600;
      color: var(--accent);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background: var(--card);
      white-space: nowrap;
    }
    th.center { text-align: center; }
    th .th-subtitle {
      display: block;
      font-size: 0.65rem;
      color: var(--muted);
      font-weight: 400;
      margin-top: 2px;
      text-transform: none;
      letter-spacing: 0;
    }
    td {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
    }
    td.center { text-align: center; }
    tr:last-child td { border-bottom: none; }
    tr.hidden { display: none; }
    .resort-name {
      font-weight: 500;
      color: var(--text);
    }
    .resort-provider {
      display: inline-block;
      margin-left: 8px;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.7rem;
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.03em;
    }
    .resort-api {
      display: block;
      font-size: 0.7rem;
      color: var(--muted);
      margin-top: 2px;
    }
    .provider-vail {
      background: rgba(111, 227, 178, 0.15);
      color: var(--accent);
    }
    .provider-ikon {
      background: rgba(116, 199, 255, 0.15);
      color: var(--accent-2);
    }
    .status-icon {
      display: inline-block;
      width: 24px;
      height: 24px;
      border-radius: 6px;
      text-align: center;
      line-height: 24px;
      font-weight: 700;
    }
    .status-yes {
      background: rgba(123, 255, 195, 0.15);
      color: var(--positive);
    }
    .status-no {
      background: rgba(255, 156, 143, 0.15);
      color: var(--negative);
      opacity: 0.4;
    }
    .status-partial {
      background: rgba(255, 204, 112, 0.15);
      color: var(--warning);
    }
    .file-count {
      color: var(--muted);
      font-size: 0.85rem;
    }
    .last-update {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 4px;
    }
    .last-update.stale {
      color: var(--warning);
    }
    .last-update.very-stale {
      color: var(--negative);
    }
    a {
      color: var(--accent);
      text-decoration: none;
      transition: opacity 0.2s ease;
    }
    a:hover {
      opacity: 0.7;
    }
    .summary-bar {
      display: flex;
      gap: 24px;
      padding: 20px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .summary-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .summary-label {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .summary-value {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text);
    }
    .summary-percent {
      font-size: 0.9rem;
      color: var(--accent);
      margin-left: 8px;
    }
    .summary-percent.low {
      color: var(--negative);
    }
    .summary-percent.medium {
      color: var(--warning);
    }
    .no-results {
      text-align: center;
      padding: 40px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="header">
      <div>
        <h1>Resort Data Overview</h1>
        <div class="subtitle">Data availability status for all resorts</div>
      </div>
      <div class="stats">
        <div class="stat-pill">
          <div class="stat-label">Total Resorts</div>
          <div class="stat-value" id="total-resorts">-</div>
        </div>
        <div class="stat-pill">
          <div class="stat-label">Vail Resorts</div>
          <div class="stat-value" id="vail-count">-</div>
        </div>
        <div class="stat-pill">
          <div class="stat-label">Ikon Resorts</div>
          <div class="stat-value" id="ikon-count">-</div>
        </div>
      </div>
    </div>

    <div class="table-container">
      <div class="summary-bar" id="summary-bar">
        <!-- Summary stats will be inserted here -->
      </div>
      <div class="filter-bar" id="filter-bar">
        <span class="filter-label">Show:</span>
        <div class="filter-group">
          <button class="filter-btn active" data-filter="all">All<span class="filter-count" id="count-all"></span></button>
          <button class="filter-btn" data-filter="vail">Vail<span class="filter-count" id="count-vail"></span></button>
          <button class="filter-btn" data-filter="ikon">Ikon<span class="filter-count" id="count-ikon"></span></button>
        </div>
        <div class="filter-divider"></div>
        <span class="filter-label">Missing:</span>
        <div class="filter-group">
          <button class="filter-btn filter-missing" data-filter="no-terrain">No Terrain<span class="filter-count" id="count-no-terrain"></span></button>
          <button class="filter-btn filter-missing" data-filter="no-lifts">No Lift Status<span class="filter-count" id="count-no-lifts"></span></button>
          <button class="filter-btn filter-missing" data-filter="no-waits">No Wait Times<span class="filter-count" id="count-no-waits"></span></button>
          <button class="filter-btn filter-missing" data-filter="no-briefs">No Briefs<span class="filter-count" id="count-no-briefs"></span></button>
        </div>
      </div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>Resort</th>
              <th class="center">Terrain<span class="th-subtitle">trails &amp; areas</span></th>
              <th class="center">Snow Report<span class="th-subtitle">conditions</span></th>
              <th class="center">Lift Status<span class="th-subtitle">open/closed</span></th>
              <th class="center">Wait Times<span class="th-subtitle">live polling</span></th>
              <th class="center">Daily Brief<span class="th-subtitle">morning report</span></th>
              <th>Data Files</th>
            </tr>
          </thead>
          <tbody id="resort-table">
            <tr>
              <td colspan="7" style="text-align: center; padding: 40px; color: var(--muted);">
                Loading resort data...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="shared/nav.js"></script>
  <script>
    initNav('overview');

    const dataFolder = '../data';
    let allResorts = [];
    let currentFilter = 'all';

    async function loadResortData() {
      try {
        const response = await fetch(`${dataFolder}/index.json`);
        const data = await response.json();

        allResorts = Object.entries(data.resorts).map(([key, resort]) => ({
          key,
          ...resort
        }));

        // Calculate summary stats
        const total = allResorts.length;
        const vailCount = allResorts.filter(r => r.provider === 'vail').length;
        const ikonCount = allResorts.filter(r => r.provider === 'ikon').length;

        const terrainCount = allResorts.filter(r => r.dataCapabilities.terrainAvailable).length;
        const snowCount = allResorts.filter(r => r.dataCapabilities.snowReportAvailable).length;
        const liftStatusCount = allResorts.filter(r => r.dataCapabilities.liftStatusAvailable).length;
        const waitTimesCount = allResorts.filter(r => r.dataCapabilities.liftWaitTimesAvailable).length;
        const briefsCount = allResorts.filter(r => r.dataCapabilities.dailyBriefAvailable).length;

        // Update header stats
        document.getElementById('total-resorts').textContent = total;
        document.getElementById('vail-count').textContent = vailCount;
        document.getElementById('ikon-count').textContent = ikonCount;

        // Update filter counts
        document.getElementById('count-all').textContent = ` (${total})`;
        document.getElementById('count-vail').textContent = ` (${vailCount})`;
        document.getElementById('count-ikon').textContent = ` (${ikonCount})`;
        document.getElementById('count-no-terrain').textContent = ` (${total - terrainCount})`;
        document.getElementById('count-no-lifts').textContent = ` (${total - liftStatusCount})`;
        document.getElementById('count-no-waits').textContent = ` (${total - waitTimesCount})`;
        document.getElementById('count-no-briefs').textContent = ` (${total - briefsCount})`;

        // Update summary bar with percentages
        const summaryBar = document.getElementById('summary-bar');
        summaryBar.innerHTML = `
          <div class="summary-item">
            <div class="summary-label">Terrain Data</div>
            <div class="summary-value">
              ${terrainCount}/${total}
              <span class="summary-percent ${getPercentClass(terrainCount/total)}">${Math.round(terrainCount/total*100)}%</span>
            </div>
          </div>
          <div class="summary-item">
            <div class="summary-label">Snow Reports</div>
            <div class="summary-value">
              ${snowCount}/${total}
              <span class="summary-percent ${getPercentClass(snowCount/total)}">${Math.round(snowCount/total*100)}%</span>
            </div>
          </div>
          <div class="summary-item">
            <div class="summary-label">Lift Status</div>
            <div class="summary-value">
              ${liftStatusCount}/${total}
              <span class="summary-percent ${getPercentClass(liftStatusCount/total)}">${Math.round(liftStatusCount/total*100)}%</span>
            </div>
          </div>
          <div class="summary-item">
            <div class="summary-label">Live Wait Times</div>
            <div class="summary-value">
              ${waitTimesCount}/${total}
              <span class="summary-percent ${getPercentClass(waitTimesCount/total)}">${Math.round(waitTimesCount/total*100)}%</span>
            </div>
          </div>
          <div class="summary-item">
            <div class="summary-label">Daily Briefs</div>
            <div class="summary-value">
              ${briefsCount}/${total}
              <span class="summary-percent ${getPercentClass(briefsCount/total)}">${Math.round(briefsCount/total*100)}%</span>
            </div>
          </div>
        `;

        // Sort resorts by provider then name
        allResorts.sort((a, b) => {
          if (a.provider !== b.provider) {
            return a.provider === 'vail' ? -1 : 1;
          }
          return a.name.localeCompare(b.name);
        });

        renderTable();
        setupFilterListeners();

      } catch (error) {
        console.error('Error loading resort data:', error);
        document.getElementById('resort-table').innerHTML = `
          <tr>
            <td colspan="7" style="text-align: center; padding: 40px; color: var(--negative);">
              Error loading data: ${error.message}
            </td>
          </tr>
        `;
      }
    }

    function getPercentClass(ratio) {
      if (ratio >= 0.8) return '';
      if (ratio >= 0.5) return 'medium';
      return 'low';
    }

    function getLastUpdateClass(dateStr) {
      if (!dateStr) return 'very-stale';
      const date = new Date(dateStr);
      const now = new Date();
      const hoursDiff = (now - date) / (1000 * 60 * 60);
      if (hoursDiff > 48) return 'very-stale';
      if (hoursDiff > 24) return 'stale';
      return '';
    }

    function formatLastUpdate(dateStr) {
      if (!dateStr) return 'Never';
      const date = new Date(dateStr);
      const now = new Date();
      const hoursDiff = Math.floor((now - date) / (1000 * 60 * 60));

      if (hoursDiff < 1) return 'Just now';
      if (hoursDiff < 24) return `${hoursDiff}h ago`;
      const daysDiff = Math.floor(hoursDiff / 24);
      if (daysDiff === 1) return 'Yesterday';
      return `${daysDiff} days ago`;
    }

    function filterResorts(filter) {
      return allResorts.filter(resort => {
        const caps = resort.dataCapabilities;
        switch (filter) {
          case 'all': return true;
          case 'vail': return resort.provider === 'vail';
          case 'ikon': return resort.provider === 'ikon';
          case 'no-terrain': return !caps.terrainAvailable;
          case 'no-lifts': return !caps.liftStatusAvailable;
          case 'no-waits': return !caps.liftWaitTimesAvailable;
          case 'no-briefs': return !caps.dailyBriefAvailable;
          default: return true;
        }
      });
    }

    function renderTable() {
      const filtered = filterResorts(currentFilter);
      const tbody = document.getElementById('resort-table');

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="no-results">No resorts match this filter</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map(resort => {
        const caps = resort.dataCapabilities;
        const providerClass = `provider-${resort.provider}`;

        const terrainLink = caps.terrainAvailable && resort.latest
          ? `<a href="${dataFolder}/${resort.key}/terrain/${resort.latest}" target="_blank">${statusIcon(true)}</a>`
          : statusIcon(false);

        const snowLink = caps.snowReportAvailable
          ? `<a href="${dataFolder}/${resort.key}/snow/" target="_blank">${statusIcon(true)}</a>`
          : statusIcon(false);

        const briefLink = caps.dailyBriefAvailable
          ? `<a href="${dataFolder}/${resort.key}/brief/" target="_blank">${statusIcon(true)}</a>`
          : statusIcon(false);

        // Lift status with link to lifts index if available
        const liftStatusLink = caps.liftStatusAvailable
          ? `<a href="${dataFolder}/${resort.key}/lifts/index.json" target="_blank">${statusIcon(true)}</a>`
          : statusIcon(false);

        const filesInfo = resort.count > 0
          ? `<span class="file-count">${resort.count} files</span><br><a href="${dataFolder}/${resort.key}/terrain/" target="_blank">View \u2192</a>`
          : `<span class="file-count" style="opacity: 0.4;">No data</span>`;

        const lastUpdate = caps.lastTerrainUpdate
          ? `<div class="last-update ${getLastUpdateClass(caps.lastTerrainUpdate)}">Updated ${formatLastUpdate(caps.lastTerrainUpdate)}</div>`
          : '';

        return `
          <tr data-provider="${resort.provider}" data-terrain="${caps.terrainAvailable}" data-lifts="${caps.liftStatusAvailable}" data-waits="${caps.liftWaitTimesAvailable}" data-briefs="${caps.dailyBriefAvailable}">
            <td>
              <span class="resort-name">${resort.name}</span>
              <span class="resort-provider ${providerClass}">${resort.provider}</span>
              ${lastUpdate}
            </td>
            <td class="center">${terrainLink}</td>
            <td class="center">${snowLink}</td>
            <td class="center">${liftStatusLink}</td>
            <td class="center">${statusIcon(caps.liftWaitTimesAvailable)}</td>
            <td class="center">${briefLink}</td>
            <td>${filesInfo}</td>
          </tr>
        `;
      }).join('');
    }

    function setupFilterListeners() {
      const filterBtns = document.querySelectorAll('.filter-btn');
      filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          // Remove active from all
          filterBtns.forEach(b => b.classList.remove('active'));
          // Add active to clicked
          btn.classList.add('active');
          // Update filter and re-render
          currentFilter = btn.dataset.filter;
          renderTable();
        });
      });
    }

    function statusIcon(available) {
      if (available) {
        return '<span class="status-icon status-yes">\u2713</span>';
      } else {
        return '<span class="status-icon status-no">\u2717</span>';
      }
    }

    loadResortData();
  </script>
</body>
</html>
