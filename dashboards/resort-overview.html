<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resort Data Overview</title>
  <link rel="stylesheet" href="shared/theme.css">
  <style>
    :root {
      --bg: #0b1a12;
      --panel: rgba(255, 255, 255, 0.02);
      --card: rgba(255, 255, 255, 0.04);
      --text: #e8f5ec;
      --muted: #9bb7a7;
      --accent: #6fe3b2;
      --accent-2: #74c7ff;
      --negative: #ff9c8f;
      --warning: #ffcc70;
    }
    body {
      background:
        radial-gradient(circle at 18% 20%, rgba(111, 227, 178, 0.11), transparent 28%),
        radial-gradient(circle at 82% 0%, rgba(116, 199, 255, 0.15), transparent 30%),
        radial-gradient(circle at 50% 100%, rgba(111, 227, 178, 0.08), transparent 35%),
        var(--bg);
    }
    .page { max-width: 1400px; }
    .stats {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .stat-pill {
      display: inline-flex;
      flex-direction: column;
      padding: 12px 16px;
      border-radius: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      font-size: 0.85rem;
    }
    .stat-pill .stat-label {
      color: var(--muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }
    .stat-pill .stat-value {
      color: var(--accent);
      font-size: 1.1rem;
      font-weight: 600;
    }

    /* Filter controls */
    .filter-bar {
      display: flex;
      gap: 12px;
      padding: 16px 20px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      align-items: center;
    }
    .filter-label {
      font-size: 0.8rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-right: 8px;
    }
    .filter-btn {
      padding: 8px 14px;
      border-radius: 8px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }
    .filter-btn:hover {
      border-color: var(--accent);
      color: var(--text);
    }
    .filter-btn.active {
      background: rgba(111, 227, 178, 0.15);
      border-color: var(--accent);
      color: var(--accent);
    }
    .filter-btn.filter-missing {
      border-color: rgba(255, 156, 143, 0.4);
    }
    .filter-btn.filter-missing:hover {
      border-color: var(--negative);
      color: var(--negative);
    }
    .filter-btn.filter-missing.active {
      background: rgba(255, 156, 143, 0.15);
      border-color: var(--negative);
      color: var(--negative);
    }
    .filter-count {
      font-size: 0.75rem;
      opacity: 0.7;
      margin-left: 4px;
    }
    .filter-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .filter-divider {
      width: 1px;
      height: 24px;
      background: var(--border);
      margin: 0 8px;
    }

    .table-container {
      background: var(--panel);
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }
    .table-scroll {
      max-height: calc(100vh - 320px);
      overflow-y: auto;
      overflow-x: hidden;
      border-radius: 0 0 16px 16px;
    }
    table {
      font-size: 0.9rem;
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
    }
    th {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 14px 16px;
      font-weight: 600;
      color: var(--accent);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background: var(--card);
      white-space: nowrap;
      box-shadow: 0 1px 0 var(--border);
    }
    th.center { text-align: center; }
    th .th-subtitle {
      display: block;
      font-size: 0.65rem;
      color: var(--muted);
      font-weight: 400;
      margin-top: 2px;
      text-transform: none;
      letter-spacing: 0;
    }
    td {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
    }
    td.center { text-align: center; }
    tr:last-child td { border-bottom: none; }
    tr.hidden { display: none; }
    .resort-name {
      font-weight: 500;
      color: var(--text);
    }
    .resort-provider {
      display: inline-block;
      margin-left: 8px;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.7rem;
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.03em;
    }
    .resort-api {
      display: block;
      font-size: 0.7rem;
      color: var(--muted);
      margin-top: 2px;
    }
    .provider-vail {
      background: rgba(111, 227, 178, 0.15);
      color: var(--accent);
    }
    .provider-ikon {
      background: rgba(116, 199, 255, 0.15);
      color: var(--accent-2);
    }
    .status-icon {
      display: inline-block;
      width: 24px;
      height: 24px;
      border-radius: 6px;
      text-align: center;
      line-height: 24px;
      font-weight: 700;
    }
    .status-yes {
      background: rgba(123, 255, 195, 0.15);
      color: var(--positive);
    }
    .status-no {
      background: rgba(255, 156, 143, 0.15);
      color: var(--negative);
      opacity: 0.4;
    }
    .status-partial {
      background: rgba(255, 204, 112, 0.15);
      color: var(--warning);
    }
    .file-count {
      color: var(--muted);
      font-size: 0.85rem;
    }
    .last-update {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 4px;
    }
    .last-update.stale {
      color: var(--warning);
    }
    .last-update.very-stale {
      color: var(--negative);
    }
    a {
      color: var(--accent);
      text-decoration: none;
      transition: opacity 0.2s ease;
    }
    a:hover {
      opacity: 0.7;
    }
    .summary-bar {
      display: flex;
      gap: 24px;
      padding: 20px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .summary-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .summary-label {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .summary-value {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text);
    }
    .summary-percent {
      font-size: 0.9rem;
      color: var(--accent);
      margin-left: 8px;
    }
    .summary-percent.low {
      color: var(--negative);
    }
    .summary-percent.medium {
      color: var(--warning);
    }
    .no-results {
      text-align: center;
      padding: 40px;
      color: var(--muted);
    }
    @media (max-width: 860px) { .table-scroll { max-height: none; } }
  </style>
</head>
<body>
  <div class="page">
    <div class="header">
      <div><h1>Resort Data</h1><div class="subtitle">Published terrain and snow · recent means within 30 hours</div></div>
      <div class="stats">
        <div class="stat-pill"><div class="stat-label">Resorts</div><div class="stat-value" id="total-resorts">—</div></div>
        <div class="stat-pill"><div class="stat-label">Recent terrain</div><div class="stat-value" id="terrain-count">—</div></div>
        <div class="stat-pill"><div class="stat-label">Recent snow</div><div class="stat-value" id="snow-count">—</div></div>
      </div>
    </div>
    <div class="table-container">
      <div class="filter-bar">
        <label for="provider">Provider</label>
        <select id="provider"><option value="all">All</option><option value="vail">Vail</option><option value="ikon">Ikon</option></select>
        <label for="freshness">Reports</label>
        <select id="freshness"><option value="all">All</option><option value="recent">Recent</option><option value="stale">Stale or missing</option></select>
        <span id="load-note" role="status"></span>
      </div>
      <div class="table-scroll"><table>
        <thead><tr><th>Resort</th><th>Terrain<span class="th-subtitle">source timestamp</span></th><th>Snow<span class="th-subtitle">collection timestamp</span></th></tr></thead>
        <tbody id="resort-table"><tr><td colspan="3">Loading reports…</td></tr></tbody>
      </table></div>
    </div>
  </div>
  <script src="shared/data-source-config.js"></script>
  <script src="shared/published-data.js"></script>
  <script src="shared/nav.js"></script>
  <script>
    initNav('overview');
    const { escape: esc, observation } = DashboardData;
    let resorts = [];
    const feeds = {};
    function reportCell(resort, kind) {
      if (feeds[kind] === null) return '<span class="last-update very-stale">Feed unavailable</span>';
      const report = resort[kind];
      if (!report.available) return '<span class="last-update">No published report</span>';
      const href = kind === 'terrain'
        ? `terrain-dashboard.html?resort=${encodeURIComponent(resort.key)}`
        : `../data/${encodeURIComponent(resort.key)}/snow.html`;
      const time = Date.parse(report.timestamp);
      const date = Number.isFinite(time) ? new Date(time).toLocaleString() : (report.date || 'Timestamp unknown');
      const source = kind === 'snow' && report.source ? `<div class="last-update">Source: ${esc(report.source)}</div>` : '';
      return `<a href="${href}">${report.recent ? 'Recent' : 'Stale'} report →</a>
        <div class="last-update ${report.recent ? '' : 'very-stale'}">${esc(date)}</div>${source}`;
    }
    function render() {
      const provider = document.getElementById('provider').value;
      const freshness = document.getElementById('freshness').value;
      const base = resorts.filter(r => provider === 'all' || r.provider === provider);
      document.getElementById('total-resorts').textContent = base.length;
      for (const kind of ['terrain', 'snow']) {
        document.getElementById(`${kind}-count`).textContent = feeds[kind] === null ? 'Unavailable' : base.filter(r => r[kind].recent).length;
      }
      const rows = base.filter(r => freshness === 'all' || (freshness === 'recent'
        ? r.terrain.recent || r.snow.recent : !r.terrain.recent || !r.snow.recent));
      document.getElementById('resort-table').innerHTML = rows.map(r => `<tr>
        <td><span class="resort-name">${esc(r.name)}</span><span class="resort-provider">${esc(r.provider)}</span></td>
        <td data-label="Terrain">${reportCell(r, 'terrain')}</td><td data-label="Snow">${reportCell(r, 'snow')}</td></tr>`).join('') || '<tr><td colspan="3" class="no-results">No matching resorts</td></tr>';
    }
    async function load() {
      try {
        const [config, terrain, snow] = await Promise.all([
          dataSourceManager.fetchData('config.json'),
          dataSourceManager.fetchData('data/latest.json').catch(() => null),
          dataSourceManager.fetchData('data/latest-snow.json').catch(() => null)
        ]);
        feeds.terrain = terrain; feeds.snow = snow;
        resorts = config.resorts.map(r => ({...r,
          terrain: observation(terrain?.[r.key], 'terrain'), snow: observation(snow?.[r.key], 'snow')
        })).sort((a, b) => Number(b.terrain.recent || b.snow.recent) - Number(a.terrain.recent || a.snow.recent) || a.name.localeCompare(b.name));
        render();
        document.getElementById('load-note').textContent = terrain && snow ? '' : 'Some published feeds could not be loaded.';
      } catch (error) {
        document.getElementById('resort-table').innerHTML = '<tr><td colspan="3">Could not load resorts. Reload to retry.</td></tr>';
      }
    }
    document.getElementById('provider').addEventListener('change', render);
    document.getElementById('freshness').addEventListener('change', render);
    load();
  </script>
</body>
</html>
