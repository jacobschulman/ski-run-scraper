<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Lift Wait Monitor</title>
  <!-- Inline fallback styles for standalone deployment (Hetzner) -->
  <style>
    :root {
      --bg: #0c1a2b;
      --panel: #0f243a;
      --card: rgba(255, 255, 255, 0.03);
      --border: rgba(255, 255, 255, 0.08);
      --text: #e9f1ff;
      --muted: #9bb3d1;
      --accent: #7bd8ff;
      --accent-2: #9b7bff;
      --positive: #7bffc3;
      --negative: #ff8f87;
      --warning: #ffcc66;
      --chip: rgba(255, 255, 255, 0.06);
      --shadow: 0 10px 50px rgba(0, 0, 0, 0.4);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at 20% 20%, rgba(123, 216, 255, 0.08), transparent 30%),
                  radial-gradient(circle at 80% 0%, rgba(155, 123, 255, 0.12), transparent 32%),
                  var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
    }
    .page { max-width: 1200px; margin: 0 auto; }
    h1 { margin: 0; font-size: 1.8rem; letter-spacing: -0.02em; }
    .subtitle { margin: 6px 0 0; color: var(--muted); font-size: 0.95rem; }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
    .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 16px; }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }
    select, input[type="search"] {
      width: 100%; background: var(--card); color: var(--text); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px; font-size: 1rem; box-shadow: var(--shadow); outline: none;
    }
    select:focus, input:focus { border-color: var(--accent); background: rgba(255, 255, 255, 0.05); }
    .meta-bar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
    .meta-pill { background: var(--card); border: 1px solid var(--border); border-radius: 999px; padding: 8px 12px; font-size: 0.9rem; color: var(--muted); }
    .pill { display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 999px; background: var(--card); border: 1px solid var(--border); box-shadow: var(--shadow); color: var(--text); font-size: 0.95rem; }
    table { width: 100%; border-collapse: collapse; background: rgba(255, 255, 255, 0.02); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
    thead { background: linear-gradient(135deg, rgba(123, 216, 255, 0.12), rgba(155, 123, 255, 0.12)); }
    th, td { text-align: left; padding: 14px 16px; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 700; }
    tbody tr:hover { background: rgba(255, 255, 255, 0.03); }
    .status { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 8px; background: var(--card); border: 1px solid var(--border); font-size: 0.9rem; }
    .status.open { color: var(--positive); border-color: rgba(123, 255, 195, 0.3); }
    .status.closed { color: var(--negative); border-color: rgba(255, 143, 135, 0.3); }
    .chip { display: inline-flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 10px; background: var(--chip); border: 1px solid var(--border); font-size: 0.9rem; }
    .empty { padding: 18px; color: var(--muted); text-align: center; }
    @media (max-width: 860px) {
      .header { flex-direction: column; align-items: flex-start; }
      table, thead, tbody, th, td, tr { display: block; }
      thead { display: none; }
      tbody tr { margin-bottom: 12px; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
      td { border-bottom: 1px solid var(--border); padding: 12px 14px; }
      td:last-child { border-bottom: none; }
      td::before { content: attr(data-label); display: block; font-size: 0.8rem; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
    }
  </style>
  <!-- External theme (will override fallback when available) -->
  <link rel="stylesheet" href="shared/theme.css">
  <style>
    .lift-name {
      font-weight: 600;
      letter-spacing: -0.01em;
      margin-bottom: 4px;
    }
    .lift-sub {
      color: var(--muted);
      font-size: 0.9rem;
    }
    .current-wait {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--text);
    }
    .current-meta {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 4px;
    }
    .chips {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: flex-start;
    }
    .chip time {
      color: var(--muted);
      font-size: 0.85rem;
    }
    .wait-graph {
      margin-top: 12px;
      width: 100%;
      height: 140px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 8px;
      padding: 8px;
      border: 1px solid var(--border);
      position: relative;
    }
    .graph-tooltip {
      position: absolute;
      padding: 6px 8px;
      background: rgba(12, 26, 43, 0.9);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.85rem;
      pointer-events: none;
      box-shadow: var(--shadow);
      opacity: 0;
      transform: translate(-50%, -120%);
      transition: opacity 0.12s ease, transform 0.12s ease;
      white-space: nowrap;
      z-index: 2;
    }
    .max-wait {
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .wait-graph svg {
      display: block;
      width: 100%;
      height: 100%;
    }
    .graph-line {
      fill: none;
      stroke: var(--accent);
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .graph-area {
      fill: var(--accent);
      opacity: 0.15;
    }
    .graph-dot {
      fill: var(--accent);
      stroke: var(--bg);
      stroke-width: 1.5;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .graph-dot:hover {
      fill: var(--positive);
      stroke-width: 2;
      r: 4;
    }
    .graph-axis {
      stroke: rgba(255, 255, 255, 0.15);
      stroke-width: 1;
    }
    .graph-label {
      fill: var(--muted);
      font-size: 9px;
      font-family: "Inter", -apple-system, sans-serif;
    }
    .notice {
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.9rem;
    }
    @media (max-width: 860px) {
      .chips { align-items: stretch; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="header">
      <div>
        <h1>Live Lift Wait Monitor</h1>
        <p class="subtitle">Debug view for all resorts with live lift scraping. Pick a resort to see most recent waits plus the last few runs.</p>
      </div>
      <div class="pill" id="resort-count">Loading...</div>
    </div>

    <div class="controls">
      <div>
        <label for="resort-select">Resort</label>
        <select id="resort-select" aria-label="Choose resort"></select>
      </div>
      <div>
        <label for="date-select">Date</label>
        <select id="date-select" aria-label="Select date"></select>
      </div>
      <div>
        <label for="lift-filter">Filter lifts (name or mountain)</label>
        <input id="lift-filter" type="search" placeholder="e.g. Gondola, Peak 8, Summit" aria-label="Filter lifts">
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px; padding-top: 24px;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <input type="checkbox" id="open-only-filter" style="width: auto; margin: 0;">
          <label for="open-only-filter" style="margin: 0; cursor: pointer;">Open lifts only</label>
        </div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <input type="checkbox" id="local-data-mode" style="width: auto; margin: 0;">
          <label for="local-data-mode" style="margin: 0; cursor: pointer; color: var(--muted); font-size: 0.9rem;" title="Use data from ../data-local folder for testing">Use local test data</label>
        </div>
      </div>
    </div>

    <div class="meta-bar" id="meta-bar"></div>

    <div id="table-wrapper">
      <table id="lift-table" aria-live="polite">
        <thead>
          <tr>
            <th>Lift</th>
            <th>Status</th>
            <th>Most Recent Wait</th>
            <th>Prior Runs</th>
          </tr>
        </thead>
        <tbody id="lift-rows">
          <tr><td colspan="4" class="empty">Loading live data...</td></tr>
        </tbody>
      </table>
      <div class="notice" id="notice"></div>
    </div>
  </div>

  <script src="shared/nav.js" onerror="window.initNav=function(){}"></script>
  <script>
    // Only show nav in dashboards environment, skip on Hetzner
    if (typeof initNav === 'function' && window.location.pathname.includes('/dashboards/')) {
      initNav('lifts');
    }

    const historyDepth = 6;
    let resorts = [];
    let resortMap = {};
    const historyCache = new Map();
    const cachedIndex = {};
    const availableDatesCache = {};

    // Auto-detect environment: Hetzner serves from root, dashboards from /dashboards/
    const isHetzner = !window.location.pathname.includes('/dashboards/');
    const basePath = isHetzner ? '' : '..';
    let dataFolder = `${basePath}/data`;
    let currentDateKey = '';

    const $ = (id) => document.getElementById(id);
    const slugify = (s) => (s || '')
      .toLowerCase()
      .replace(/[^\w\s-]/g, '')
      .replace(/\s+/g, '-')
      .replace(/--+/g, '-')
      .trim();
    const canonicalLiftId = (lift) => {
      if (!lift) return '';
      return `${slugify(lift.mountain || 'unknown')}:${slugify(lift.name || 'unknown')}`;
    };

    const timeAgo = (iso) => {
      if (!iso) return '';
      const t = new Date(iso);
      if (Number.isNaN(t)) return '';
      const diffMs = Date.now() - t.getTime();
      const minutes = Math.max(0, Math.round(diffMs / 60000));
      if (minutes < 1) return 'just now';
      if (minutes < 60) return minutes + 'm ago';
      const hours = Math.floor(minutes / 60);
      const rem = minutes % 60;
      if (hours < 24) return rem ? hours + 'h ' + rem + 'm ago' : hours + 'h ago';
      const days = Math.floor(hours / 24);
      return days + 'd ' + (hours % 24) + 'h ago';
    };

    const formatClock = (iso, tz) => {
      if (!iso) return '';
      const t = new Date(iso);
      if (Number.isNaN(t)) return '';
      return new Intl.DateTimeFormat([], { hour: 'numeric', minute: '2-digit', timeZone: tz || 'UTC' }).format(t);
    };

    const formatWait = (value) => {
      if (value === null || value === undefined) return '\u2014';
      if (Number.isNaN(Number(value))) return String(value);
      return value + ' min';
    };

    const deriveDateKey = (resort) => {
      const fromGenerated = resort.generated ? resort.generated.split('T')[0] : null;
      const fromLift = resort.lifts && resort.lifts.length ? resort.lifts[0].lastUpdated?.split('T')[0] : null;
      return fromGenerated || fromLift || new Date().toISOString().slice(0, 10);
    };

    const showGraphTooltip = (dot, tooltip, container, event) => {
      if (!tooltip || !dot || !container) return;
      const rect = container.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;
      tooltip.textContent = `${dot.dataset.wait} min at ${dot.dataset.clock}`;
      tooltip.style.left = `${x}px`;
      tooltip.style.top = `${y}px`;
      tooltip.style.opacity = '1';
      tooltip.style.transform = 'translate(-50%, -140%)';
    };

    const hideGraphTooltip = (tooltip) => {
      if (!tooltip) return;
      tooltip.style.opacity = '0';
      tooltip.style.transform = 'translate(-50%, -120%)';
    };

    async function getAvailableDates(resortKey, resortData) {
      const cacheKey = dataFolder + '-' + resortKey;
      if (availableDatesCache[cacheKey]) return availableDatesCache[cacheKey];
      const dates = new Set();
      const fallbackDate = deriveDateKey(resortData || {});
      if (fallbackDate) dates.add(fallbackDate);

      try {
        const res = await fetch(`${dataFolder}/${resortKey}/lifts/dates.json`);
        if (res.ok) {
          const list = await res.json();
          (list || []).forEach(d => dates.add(d));
        }
      } catch (_) {}

      // Probe recent dates only if we still have very few options
      if (dates.size < 3) {
        const now = new Date();
        for (let i = 0; i < 21; i++) {
          const probe = new Date(now);
          probe.setDate(now.getDate() - i);
          const key = probe.toISOString().slice(0, 10);
          if (dates.has(key)) continue;
          try {
            const res = await fetch(`${dataFolder}/${resortKey}/lifts/${key}.ndjson`, { method: 'HEAD' });
            if (res.ok) dates.add(key);
          } catch (_) {}
        }
      }

      if (dates.size === 0) dates.add(new Date().toISOString().slice(0, 10));
      const sorted = Array.from(dates).sort();
      availableDatesCache[cacheKey] = sorted;
      return sorted;
    }

    async function populateDateSelect(resortKey, resortData, activeDate) {
      const select = $('date-select');
      select.innerHTML = '';
      const dates = await getAvailableDates(resortKey, resortData);
      const unique = new Set(dates);
      if (activeDate) unique.add(activeDate);
      const sorted = Array.from(unique).sort();
      sorted.forEach(d => {
        const opt = document.createElement('option');
        opt.value = d;
        opt.textContent = d;
        select.appendChild(opt);
      });
      select.value = activeDate || sorted[sorted.length - 1] || '';
    }

    async function fetchHistory(resortKey, dateKey, fullHistory = false) {
      const cacheKey = dataFolder + '-' + resortKey + '-' + dateKey + (fullHistory ? '-full' : '');
      if (historyCache.has(cacheKey)) return historyCache.get(cacheKey);

      const promise = (async () => {
      const parseNdjson = (text) => {
        const lines = text.trim().split('\n').filter(Boolean);
          const parsed = [];
          for (const line of lines) {
            try { parsed.push(JSON.parse(line)); } catch (_) {}
          }
          const history = {};
          for (let i = parsed.length - 1; i >= 0; i--) {
            const entry = parsed[i];
            if (!entry) continue;
            const canonicalId = canonicalLiftId(entry);
            const bucket = history[canonicalId] || (history[canonicalId] = []);
            if (!fullHistory && bucket.length >= historyDepth) continue;
            if (bucket.some(h => h.timestamp === entry.timestamp)) continue;
            bucket.push({ ...entry, liftId: canonicalId });
          }
          return history;
      };

        const tryFetch = async (rangeBytes) => {
          const headers = rangeBytes ? { 'Range': `bytes=-${rangeBytes}` } : {};
          const res = await fetch(`${dataFolder}/${resortKey}/lifts/${dateKey}.ndjson`, { headers });
          if (!res.ok) throw new Error(`NDJSON ${res.status}`);
          return res.text();
        };

        try {
          let text;

          // If we need full history, always fetch the entire file
          if (fullHistory) {
            text = await tryFetch();
            return parseNdjson(text);
          }

          // Otherwise, try to use tail optimization for recent history
          let usedTail = true;
          try {
            text = await tryFetch(120000);
          } catch (_) {
            usedTail = false;
            text = await tryFetch();
          }

          let history = parseNdjson(text);
          const hasDepth = Object.values(history).some(list => list.length >= historyDepth);
          if (usedTail && !hasDepth) {
            text = await tryFetch();
            history = parseNdjson(text);
          }
          return history;
        } catch (_) {
          return {};
        }
      })();

      historyCache.set(cacheKey, promise);
      return promise;
    }

    function renderResortOptions() {
      const select = $('resort-select');
      select.innerHTML = '';
      const placeholder = document.createElement('option');
      placeholder.value = '';
      placeholder.textContent = 'Select a resort';
      placeholder.disabled = true;
      placeholder.selected = true;
      select.appendChild(placeholder);
      resorts.forEach(({ key, name }) => {
        const opt = document.createElement('option');
        opt.value = key;
        opt.textContent = name;
        select.appendChild(opt);
      });
    }

    function setMeta(resortData, dateKey, tz) {
      const metaBar = $('meta-bar');
      metaBar.innerHTML = '';
      if (!resortData) return;

      const metaItems = [
        { label: 'Lifts', value: resortData.liftCount || (resortData.lifts ? resortData.lifts.length : '\u2014') },
        { label: 'Last scrape', value: resortData.generated ? timeAgo(resortData.generated) + ' \u00b7 ' + formatClock(resortData.generated, tz) : '\u2014' },
        { label: 'Data file', value: dateKey + '.ndjson' }
      ];

      metaItems.forEach(item => {
        const pill = document.createElement('div');
        pill.className = 'meta-pill';
        pill.innerHTML = '<strong>' + item.label + '</strong> ' + item.value;
        metaBar.appendChild(pill);
      });
    }

    function createWaitGraph(history, openTime, closeTime, tz) {
      if (!history || history.length === 0) return null;

      // Parse open/close times to get time range
      const parseTime = (timeStr) => {
        if (!timeStr) return null;
        const match = timeStr.match(/(\d+):(\d+)\s*(am|pm)?/i);
        if (!match) return null;
        let hours = parseInt(match[1], 10);
        const minutes = parseInt(match[2], 10);
        const meridiem = match[3]?.toLowerCase();
        if (meridiem) {
          if (meridiem === 'pm' && hours < 12) hours += 12;
          if (meridiem === 'am' && hours === 12) hours = 0;
        }
        return hours * 60 + minutes; // minutes since midnight
      };

      const openMinutes = parseTime(openTime) || 0;
      const closeMinutes = parseTime(closeTime) || 1440;

      // Prepare data points
      const dataPoints = history
        .map(entry => {
          const t = new Date(entry.timestamp);
          if (Number.isNaN(t.getTime())) return null;
          const minutes = t.getHours() * 60 + t.getMinutes();
          return {
            time: minutes,
            wait: entry.waitMinutes != null ? entry.waitMinutes : 0,
            timestamp: entry.timestamp,
            status: entry.status
          };
        })
        .filter(p => p && p.wait >= 0)
        .sort((a, b) => a.time - b.time);

      if (dataPoints.length === 0) return null;

      // Calculate scales - adapt to actual data range, not full operating hours
      const dataMinTime = Math.min(...dataPoints.map(p => p.time));
      const dataMaxTime = Math.max(...dataPoints.map(p => p.time));

      // Add padding so data points aren't cramped at edges
      // Minimum 30 min span, with 5% padding on each side
      const dataSpan = dataMaxTime - dataMinTime;
      const minSpan = 30; // minimum 30 minutes to display
      const effectiveSpan = Math.max(dataSpan, minSpan);
      const timePadding = Math.max(effectiveSpan * 0.05, 5); // at least 5 min padding

      const minTime = dataMinTime - timePadding;
      const maxTime = dataMinTime + effectiveSpan + timePadding;
      const maxWait = Math.max(...dataPoints.map(p => p.wait), 1);

      // Helper to format minutes as time string for labels
      const formatMinutes = (mins) => {
        const h = Math.floor(mins / 60);
        const m = mins % 60;
        const hour12 = h % 12 || 12;
        const ampm = h < 12 ? 'am' : 'pm';
        return m === 0 ? `${hour12}${ampm}` : `${hour12}:${String(m).padStart(2, '0')}${ampm}`;
      };

      const width = 300;
      const height = 120;
      const padding = { top: 8, right: 8, bottom: 18, left: 28 };
      const graphWidth = width - padding.left - padding.right;
      const graphHeight = height - padding.top - padding.bottom;

      const xScale = (minutes) => padding.left + ((minutes - minTime) / (maxTime - minTime)) * graphWidth;
      const yScale = (wait) => padding.top + graphHeight - ((wait / maxWait) * graphHeight);

      // Create SVG
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
      svg.style.width = '100%';
      svg.style.height = '100%';

      // Draw axes
      const xAxis = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      xAxis.setAttribute('class', 'graph-axis');
      xAxis.setAttribute('x1', padding.left);
      xAxis.setAttribute('y1', padding.top + graphHeight);
      xAxis.setAttribute('x2', width - padding.right);
      xAxis.setAttribute('y2', padding.top + graphHeight);
      svg.appendChild(xAxis);

      const yAxis = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      yAxis.setAttribute('class', 'graph-axis');
      yAxis.setAttribute('x1', padding.left);
      yAxis.setAttribute('y1', padding.top);
      yAxis.setAttribute('x2', padding.left);
      yAxis.setAttribute('y2', padding.top + graphHeight);
      svg.appendChild(yAxis);

      // Add time labels - show actual data range
      const startLabel = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      startLabel.setAttribute('class', 'graph-label');
      startLabel.setAttribute('x', padding.left);
      startLabel.setAttribute('y', height - 2);
      startLabel.setAttribute('text-anchor', 'start');
      startLabel.textContent = formatMinutes(minTime);
      svg.appendChild(startLabel);

      const endLabel = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      endLabel.setAttribute('class', 'graph-label');
      endLabel.setAttribute('x', width - padding.right);
      endLabel.setAttribute('y', height - 2);
      endLabel.setAttribute('text-anchor', 'end');
      endLabel.textContent = formatMinutes(maxTime);
      svg.appendChild(endLabel);

      // Add max wait label
      const maxLabel = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      maxLabel.setAttribute('class', 'graph-label');
      maxLabel.setAttribute('x', 2);
      maxLabel.setAttribute('y', padding.top + 10);
      maxLabel.setAttribute('text-anchor', 'start');
      maxLabel.textContent = maxWait + 'm';
      svg.appendChild(maxLabel);

      // Draw area fill
      if (dataPoints.length > 0) {
        const areaData = 'M' + padding.left + ',' + (padding.top + graphHeight) + ' ' +
          dataPoints.map(p => 'L' + xScale(p.time) + ',' + yScale(p.wait)).join(' ') + ' ' +
          'L' + xScale(dataPoints[dataPoints.length - 1].time) + ',' + (padding.top + graphHeight) + ' Z';

        const area = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        area.setAttribute('class', 'graph-area');
        area.setAttribute('d', areaData);
        svg.appendChild(area);
      }

      // Draw line
      if (dataPoints.length > 1) {
        const pathData = dataPoints.map((p, i) => {
          const x = xScale(p.time);
          const y = yScale(p.wait);
          return (i === 0 ? 'M' : 'L') + x + ',' + y;
        }).join(' ');

        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('class', 'graph-line');
        path.setAttribute('d', pathData);
        svg.appendChild(path);
      }

      // Draw dots
      dataPoints.forEach(p => {
        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('class', 'graph-dot');
        circle.setAttribute('cx', xScale(p.time));
        circle.setAttribute('cy', yScale(p.wait));
        circle.setAttribute('r', 3);
        circle.dataset.wait = p.wait;
        circle.dataset.clock = formatClock(p.timestamp, tz);
        const title = document.createElementNS('http://www.w3.org/2000/svg', 'title');
        const waitLabel = p.wait != null ? `${p.wait} min wait` : (p.status || 'No data');
        title.textContent = formatClock(p.timestamp, tz) + ' \u2014 ' + waitLabel;
        circle.appendChild(title);
        svg.appendChild(circle);
      });

      return svg;
    }

    function renderRows(resortData, history, fullHistory, tz, dateKey) {
      const tbody = $('lift-rows');
      const filter = $('lift-filter').value.trim().toLowerCase();
      const openOnly = $('open-only-filter').checked;
      const liftMap = new Map();

      const addOrMergeLift = (lift) => {
        if (!lift) return;
        const id = canonicalLiftId(lift);
        const existing = liftMap.get(id);
        if (!existing) {
          liftMap.set(id, { ...lift, liftId: id });
          return;
        }
        // Prefer entry with status/lastUpdated/open/close populated
        const merged = { ...existing };
        if (lift.status) merged.status = lift.status;
        if (lift.lastUpdated && (!merged.lastUpdated || new Date(lift.lastUpdated) > new Date(merged.lastUpdated))) {
          merged.lastUpdated = lift.lastUpdated;
          merged.waitMinutes = lift.waitMinutes !== undefined ? lift.waitMinutes : merged.waitMinutes;
        }
        merged.openTime = merged.openTime || lift.openTime;
        merged.closeTime = merged.closeTime || lift.closeTime;
        merged.mountain = merged.mountain || lift.mountain;
        merged.type = merged.type || lift.type;
        merged.name = merged.name || lift.name;
        liftMap.set(id, merged);
      };

      (resortData && resortData.lifts ? resortData.lifts : []).forEach(addOrMergeLift);

      // Ensure we include lifts seen in history even if not in index
      Object.keys(fullHistory || {}).forEach(liftId => {
        const latest = fullHistory[liftId] && fullHistory[liftId][0];
        if (latest) {
          addOrMergeLift({ ...latest, liftId });
        }
      });

      const liftsSource = Array.from(liftMap.values());

      if (!liftsSource.length) {
        tbody.innerHTML = '<tr><td colspan="4" class="empty">No lift data found.</td></tr>';
        return;
      }

      const lifts = liftsSource.sort((a, b) => {
        // Sort open lifts first
        const aOpen = a.status && a.status.toLowerCase() === 'open' ? 1 : 0;
        const bOpen = b.status && b.status.toLowerCase() === 'open' ? 1 : 0;
        if (aOpen !== bOpen) return bOpen - aOpen;
        return a.name.localeCompare(b.name);
      });
      let shown = 0;
      tbody.innerHTML = '';

      for (const lift of lifts) {
        const text = (lift.name + ' ' + (lift.mountain || '')).toLowerCase();
        if (filter && !text.includes(filter)) continue;

        const tr = document.createElement('tr');
        const fullHist = fullHistory[lift.liftId] || [];
        const latestEntry = fullHist[0];
        const displayLift = { ...lift };
        if (latestEntry) {
          displayLift.waitMinutes = latestEntry.waitMinutes;
          displayLift.status = latestEntry.status || displayLift.status;
          displayLift.lastUpdated = latestEntry.timestamp;
          displayLift.openTime = displayLift.openTime || latestEntry.openTime;
          displayLift.closeTime = displayLift.closeTime || latestEntry.closeTime;
        }

        // Filter by open status if checkbox is checked (after merging latest status)
        const isOpen = displayLift.status && displayLift.status.toLowerCase() === 'open';
        if (openOnly && !isOpen) continue;

        const liftCell = document.createElement('td');
        liftCell.setAttribute('data-label', 'Lift');
        const liftMetadata = [displayLift.mountain || 'Unknown zone', displayLift.type || ''];
        if (displayLift.openTime && displayLift.closeTime) {
          liftMetadata.push(displayLift.openTime + ' - ' + displayLift.closeTime);
        }
        liftCell.innerHTML = '<div class="lift-name">' + displayLift.name + '</div>' +
          '<div class="lift-sub">' + liftMetadata.filter(Boolean).join(' \u00b7 ') + '</div>';
        tr.appendChild(liftCell);

        const statusCell = document.createElement('td');
        statusCell.setAttribute('data-label', 'Status');
        const status = document.createElement('span');
        status.className = 'status ' + (displayLift.status && displayLift.status.toLowerCase() === 'open' ? 'open' : 'closed');
        status.textContent = displayLift.status || '\u2014';
        statusCell.appendChild(status);
        tr.appendChild(statusCell);

        const currentCell = document.createElement('td');
        currentCell.setAttribute('data-label', 'Most Recent Wait');
        const currentWait = document.createElement('div');
        currentWait.className = 'current-wait';
        currentWait.textContent = formatWait(displayLift.waitMinutes);
        const meta = document.createElement('div');
        meta.className = 'current-meta';
        meta.textContent = displayLift.lastUpdated ? 'as of ' + formatClock(displayLift.lastUpdated, tz) + ' (' + timeAgo(displayLift.lastUpdated) + ')' : 'no timestamp';
        currentCell.appendChild(currentWait);
        currentCell.appendChild(meta);

        // Add wait time graph to current wait column (using full history for all data points)
        const graph = createWaitGraph(fullHist, displayLift.openTime, displayLift.closeTime, tz);
        if (graph) {
          const graphContainer = document.createElement('div');
          graphContainer.className = 'wait-graph';
          const tooltip = document.createElement('div');
          tooltip.className = 'graph-tooltip';
          graphContainer.appendChild(tooltip);
          graphContainer.appendChild(graph);
          currentCell.appendChild(graphContainer);
          const longest = fullHist.reduce((acc, entry) => {
            if (entry.waitMinutes === null || entry.waitMinutes === undefined) return acc;
            if (!acc || entry.waitMinutes > acc.waitMinutes) return entry;
            return acc;
          }, null);
          if (longest) {
            const longestEl = document.createElement('div');
            longestEl.className = 'max-wait';
            longestEl.textContent = 'Longest wait: ' + longest.waitMinutes + ' min at ' + formatClock(longest.timestamp, tz) + (dateKey ? ' (' + dateKey + ')' : '');
            currentCell.appendChild(longestEl);
          }
          const attachTooltip = (evt, dot) => showGraphTooltip(dot, tooltip, graphContainer, evt);
          graph.querySelectorAll('.graph-dot').forEach(dot => {
            dot.addEventListener('mouseenter', (evt) => attachTooltip(evt, dot));
            dot.addEventListener('mousemove', (evt) => attachTooltip(evt, dot));
            dot.addEventListener('mouseleave', () => hideGraphTooltip(tooltip));
          });
        }

        tr.appendChild(currentCell);

        const histCell = document.createElement('td');
        histCell.setAttribute('data-label', 'Prior Runs');
        const chipsWrap = document.createElement('div');
        chipsWrap.className = 'chips';
        // Use limited history for the chips
        const hist = history[lift.liftId] || [];
        if (hist.length === 0) {
          histCell.innerHTML = '<div class="lift-sub">No prior runs</div>';
        } else {
          hist.forEach((entry, idx) => {
            const chip = document.createElement('span');
            chip.className = 'chip';
            chip.innerHTML = '<strong>' + formatWait(entry.waitMinutes) + '</strong> <time>' + timeAgo(entry.timestamp) + '</time>';
            if (idx === 0 && lift.lastUpdated && lift.lastUpdated !== entry.timestamp) {
              chip.title = 'Latest NDJSON time differs from lastUpdated';
            }
            chipsWrap.appendChild(chip);
          });
          histCell.appendChild(chipsWrap);
        }
        tr.appendChild(histCell);

        tbody.appendChild(tr);
        shown++;
      }

      if (!shown) {
        tbody.innerHTML = '<tr><td colspan="4" class="empty">No lifts match that filter.</td></tr>';
      }

      $('notice').textContent = 'Showing ' + shown + ' of ' + lifts.length + ' lifts' + (filter ? ' (filtered)' : '') + '.';
    }

    async function loadResort(resortKey, requestedDate) {
      const resortInfo = resortMap[resortKey];
      if (!resortInfo) return;
      $('notice').textContent = 'Loading recent runs...';

      try {
        const cacheKey = `${dataFolder}-${resortKey}`;
        if (!cachedIndex[cacheKey]) {
          const res = await fetch(`${dataFolder}/${resortKey}/lifts/index.json`);
          if (!res.ok) throw new Error('Index fetch failed');
          cachedIndex[cacheKey] = await res.json();
        }
        const resortData = cachedIndex[cacheKey];
        const dateKey = requestedDate || currentDateKey || deriveDateKey(resortData);
        currentDateKey = dateKey;
        await populateDateSelect(resortKey, resortData, dateKey);
        const tz = resortInfo.timezone || 'UTC';
        setMeta(resortData, dateKey, tz);
        // Fetch limited history for chips and full history for graphs
        const [history, fullHistory] = await Promise.all([
          fetchHistory(resortKey, dateKey, false),
          fetchHistory(resortKey, dateKey, true)
        ]);
        renderRows(resortData, history, fullHistory, tz, dateKey);
      } catch (err) {
        $('lift-rows').innerHTML = '<tr><td colspan="4" class="empty">Failed to load resort data.</td></tr>';
        $('notice').textContent = err.message || String(err);
      }
    }

    function applyQueryParam(resortKey) {
      const url = new URL(window.location.href);
      url.searchParams.set('resort', resortKey);
      window.history.replaceState({}, '', url);
    }

    async function init() {
      // Restore local data mode preference from localStorage
      const savedLocalMode = localStorage.getItem('localDataMode');
      if (savedLocalMode === 'true') {
        dataFolder = `${basePath}/data-local`;
        $('local-data-mode').checked = true;
      }

      try {
        const configRes = await fetch(`${basePath}/config.json`);
        const config = await configRes.json();
        resorts = (config.resorts || []).map(r => ({ key: r.key, name: r.name, timezone: r.timezone })).sort((a, b) => a.name.localeCompare(b.name));
        resortMap = resorts.reduce((acc, r) => { acc[r.key] = r; return acc; }, {});

        $('resort-count').textContent = resorts.length + ' resorts configured';
        renderResortOptions();

        const params = new URLSearchParams(window.location.search);
        const requested = params.get('resort');
        const initial = requested && resortMap[requested] ? requested : '';
        if (initial) {
          $('resort-select').value = initial;
          await loadResort(initial);
        } else {
          $('lift-rows').innerHTML = '<tr><td colspan="4" class="empty">Pick a resort to load live lift waits.</td></tr>';
          $('notice').textContent = 'Select a resort to load data.';
        }
      } catch (err) {
        $('lift-rows').innerHTML = '<tr><td colspan="4" class="empty">Failed to load config.json</td></tr>';
        $('notice').textContent = 'Could not load resort list.';
      }
    }

    $('resort-select').addEventListener('change', async (e) => {
      const key = e.target.value;
      currentDateKey = '';
      applyQueryParam(key);
      await loadResort(key);
    });

    $('date-select').addEventListener('change', async (e) => {
      const key = $('resort-select').value;
      if (!key) return;
      currentDateKey = e.target.value;
      await loadResort(key, currentDateKey);
    });

    $('lift-filter').addEventListener('input', async () => {
      const key = $('resort-select').value;
      const resortInfo = resortMap[key];
      const cacheKey = `${dataFolder}-${key}`;
      if (!resortInfo || !cachedIndex[cacheKey]) return;
      const resortData = cachedIndex[cacheKey];
      const dateKey = currentDateKey || deriveDateKey(resortData);
      const tz = resortInfo.timezone || 'UTC';
      const [history, fullHistory] = await Promise.all([
        fetchHistory(key, dateKey, false),
        fetchHistory(key, dateKey, true)
      ]);
      renderRows(resortData, history, fullHistory, tz, dateKey);
    });

    $('open-only-filter').addEventListener('change', async () => {
      const key = $('resort-select').value;
      const resortInfo = resortMap[key];
      const cacheKey = `${dataFolder}-${key}`;
      if (!resortInfo || !cachedIndex[cacheKey]) return;
      const resortData = cachedIndex[cacheKey];
      const dateKey = currentDateKey || deriveDateKey(resortData);
      const tz = resortInfo.timezone || 'UTC';
      const [history, fullHistory] = await Promise.all([
        fetchHistory(key, dateKey, false),
        fetchHistory(key, dateKey, true)
      ]);
      renderRows(resortData, history, fullHistory, tz, dateKey);
    });

    $('local-data-mode').addEventListener('change', async (e) => {
      dataFolder = e.target.checked ? `${basePath}/data-local` : `${basePath}/data`;
      localStorage.setItem('localDataMode', e.target.checked);
      // Clear caches
      historyCache.clear();
      Object.keys(cachedIndex).forEach(key => delete cachedIndex[key]);
      Object.keys(availableDatesCache).forEach(key => delete availableDatesCache[key]);
      // Reload current resort if one is selected
      const key = $('resort-select').value;
      if (key) {
        await loadResort(key);
      }
    });

    init();
  </script>
</body>
</html>
